<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0f382c;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* -------------------------------------------------- */
        /* 1. شاشة الترحيب (Welcome Screen) */
        /* -------------------------------------------------- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0d3b2e, #1b5e43, #08271e);
            /* زخرفة إسلامية بالخلفية */
            background-image: radial-gradient(rgba(212, 175, 55, 0.15) 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .welcome-card {
            background: linear-gradient(145deg, #1d4e89, #00296b);
            border: 3px solid #d4af37; /* إطار ذهبي */
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
            text-align: center;
            cursor: pointer;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            max-width: 90%;
            width: 450px;
        }

        .welcome-card:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.6);
        }

        .welcome-card h1 {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }

        .welcome-card p {
            color: #d4af37;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* -------------------------------------------------- */
        /* 2. الواجهة الرئيسية (Main Content) */
        /* -------------------------------------------------- */
        #main-app {
            display: none; /* تظهر بعد الكبس على الترحيب */
            padding: 30px 15px;
            min-height: 100vh;
            /* خلفية بتأثير زخرفي رمضاني وإسلامي */
            background: linear-gradient(rgba(15, 56, 44, 0.92), rgba(8, 39, 30, 0.95)),
                        url('https://www.transparenttextures.com/patterns/islamic-art.png');
            background-color: #0f382c;
        }

        .header-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title h2 {
            font-family: 'Amiri', serif;
            font-size: 3rem;
            color: #d4af37;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }

        .header-title p {
            color: #b7e4c7;
            font-size: 1.2rem;
        }

        /* شبكة المربعات الـ 200 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(5px);
            border: 2px solid #2d6a4f;
            border-radius: 15px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 120px;
        }

        .card:hover {
            background: #2d6a4f;
            border-color: #d4af37;
            transform: translateY(-7px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }

        .card-number {
            font-size: 0.85rem;
            color: #d4af37;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.4;
        }

        /* -------------------------------------------------- */
        /* 3. النافذة المنبثقة عرض المحتوى (Modal) */
        /* -------------------------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal-box {
            background: #ffffff;
            color: #1b4332;
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            border: 3px solid #d4af37;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            color: #1b4332;
        }

        .close-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .close-btn:hover { background: #c1121f; }

        .modal-body {
            overflow-y: auto;
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

            background: #f8f9fa;
            border-right: 5px solid #2d6a4f;

            border-radius: 10px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #212529;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

            color: #1b4332;
            margin-left: 8px;
        }
    </style>

            ],
            "أدعية البركة في المال والعمر": [
                "عَنْ أَنَسٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَتْ أُمِّي: يَا رَسُولَ اللَّهِ، خَادِمُكَ أَنَسٌ ادْعُ اللَّهَ لَهُ، قَالَ: «اللَّهُمَّ أَكْثِرْ مَالَهُ، وَوَلَدَهُ، وَبَارِكْ لَهُ فِيمَا أَعْطَيْتَهُ».",
                "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ أَنَّ النَّبِيَّ ﷺ قَالَ: «مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ، وَمَا زَادَ اللَّهُ عَبْدًا بِعَفْوٍ إِلَّا عِزًّا»."
            ],
            "أدعية المغفرة للذنوب": [
                "سيد الاستغفار: «اللَّهُمَّ أَنْتَ رَبِّي لاَ إِلَهَ إِلاَّ أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ».",
                "عَنْ أَبِي بَكْرٍ الصِّدِّيقِ رَضِيَ اللَّهُ عَنْهُ أَنَّهُ قَالَ لِرَسُولِ اللَّهِ ﷺ: عَلِّمْنِي دُعَاءً أَدْعُو بِهِ فِي صَلاَتِي، قَالَ: «قُلْ: اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْمًا كَثِيرًا، وَلاَ يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ، فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ، وَارْحَمْنِي إِنَّكَ أَنْتَ الغَفُورُ الرَّحِيمُ»."
            ],
            "مواقف النبي ﷺ مع الأطفال": [
                "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: أَبَصَرَ الأَقْرَعُ بْنُ حَابِسٍ النَّبِيَّ ﷺ يُقَبِّلُ الحَسَنَ، فَقَالَ: إِنَّ لِي عَشَرَةً مِنَ الوَلَدِ مَا قَبَّلْتُ مِنْهُمْ أَحَدًا، فَنَظَرَ إِلَيْهِ رَسُولُ اللَّهِ ﷺ ثُمَّ قَالَ: «مَنْ لاَ يَرْحَمُ لاَ يُرْحَمُ».",
                "عَنْ أَنَسٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: «كَانَ النَّبِيُّ ﷺ لَيُخَالِطُنَا، حَتَّى يَقُولَ لأَخٍ لِي صَغِيرٍ: يَا أَبَا عُمَيْرٍ، مَا فَعَلَ النُّغَيْرُ؟» (وفيه ملاطفة النبي للأطفال ومزاحه معهم).",
                "عَنْ عَائِشَةَ رَضِيَ اللَّهُ عَنْهَا أَنَّ النَّبِيَّ ﷺ كَانَ يُؤْتَى بِالصِّبْيَانِ فَيُبَرِّكُ عَلَيْهِمْ وَيُحَنِّكُهُمْ."
            ]
        };

        // إنشاء الـ 200 مربع داخل شبكة الواجهة
        const grid = document.getElementById('grid');
        titles.forEach((title, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(title);
            card.innerHTML = `
                <div class="card-number">مربع #${index + 1}</div>
                <div class="card-title">${title}</div>
            `;
            grid.appendChild(card);
        });

        // فتح النافذة المنبثقة
        function openModal(title) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');

            modalTitle.innerText = title;
            modalContent.innerHTML = '';

            // التثبت من وجود نصوص في القواعد أو إظهار النص التلقائي للعنوان
            const items = database[title] || [
                `آيات وأدعية موثوقة خاصة بـ (${title}).`,
                `عَنْ رَسُولِ اللَّهِ ﷺ قَالَ: «الدُّعَاءُ هُوَ العِبَادَةُ».`,
                `من أدعية النبي ﷺ: «اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى».`,
                `قال تعالى: ﴿وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾.`
            ];

            items.forEach((item, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item-card';
                itemDiv.innerHTML = `<b>${idx + 1}.</b> ${item}`;
                modalContent.appendChild(itemDiv);
            });

            modal.style.display = 'flex';
        }

        // إغلاق النافذة
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
