<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#1a0000,#000);
color:white;
}

header{
padding:15px;
background:#111;
position:sticky;
top:0;
z-index:1000;
border-bottom:1px solid rgba(255,215,0,.3);
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:bold;
color:#ffd700;
}

.logo-box{
width:40px;
height:40px;
border-radius:10px;
background:linear-gradient(135deg,#ffd700,#ff0000);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.hero{
padding:40px 20px 20px 20px;
text-align:center;
}

.hero h1{
font-size:35px;
color:#ffd700;
margin-bottom:10px;
}

.tabs-container {
display:flex;
justify-content:center;
gap:15px;
padding:10px;
margin-bottom:10px;
}

.tab-btn {
padding:12px 24px;
font-size:16px;
font-weight:bold;
border:1px solid #ffd700;
border-radius:25px;
background:transparent;
color:white;
cursor:pointer;
transition:.3s;
}

.tab-btn.active {
background:linear-gradient(90deg,#ffd700,#ff0000);
border:none;
box-shadow:0 0 10px rgba(255,215,0,0.4);
}

.search{
text-align:center;
padding:15px;
}

.search input{
width:80%;
padding:12px;
border:none;
border-radius:12px;
background:#111;
color:white;
font-size:16px;
outline:none;
border:1px solid rgba(255,215,0,.1);
}

.search input:focus{
border:1px solid #ffd700;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
border-radius:15px;
overflow:hidden;
transition:.3s;
border:1px solid rgba(255,215,0,.2);
display:flex;
flex-direction:column;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 5px 15px rgba(255,215,0,.1);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
background:#222;
}

.card-content{
padding:15px;
display:flex;
flex-direction:column;
flex-grow:1;
}

.card-content h3{
font-size:18px;
margin-bottom:5px;
color:#fff;
}

.card-content p{
font-size:14px;
color:#aaa;
margin-bottom:10px;
text-transform:capitalize;
}

.download-btn{
display:block;
text-align:center;
margin-top:auto;
padding:10px 15px;
border-radius:10px;
background:linear-gradient(90deg,#ffd700,#ff0000);
color:white;
text-decoration:none;
font-weight:bold;
transition:.2s;
}

.download-btn:hover{
opacity:0.9;
}
</style>
</head>
