<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAK Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0a0a0a,#1a001f);
color:white;
}

header{
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#b8860b;
text-shadow:0 0 10px purple;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
}

.menu{
font-size:22px;
cursor:pointer;
}

.dropdown{
display:none;
position:absolute;
right:10px;
top:60px;
background:#111;
border:1px solid gold;
border-radius:10px;
overflow:hidden;
}

.dropdown div{
padding:10px;
cursor:pointer;
}

.dropdown div:hover{
background:gold;
color:black;
}

.tabs{
display:flex;
justify-content:center;
gap:10px;
margin:10px;
}

button{
padding:10px 15px;
border:none;
border-radius:20px;
cursor:pointer;
background:#222;
color:white;
}

.active{
background:gold;
color:black;
}

.search{
text-align:center;
margin:10px;
}

input{
width:80%;
padding:10px;
border-radius:10px;
border:none;
outline:none;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
padding:15px;
}

.card{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,215,0,0.2);
border-radius:15px;
padding:10px;
}

img{
width:100%;
height:140px;
object-fit:cover;
border-radius:10px;
}

a{
display:block;
margin-top:10px;
padding:8px;
text-align:center;
background:linear-gradient(90deg,gold,red);
color:white;
text-decoration:none;
border-radius:10px;
}
</style>

</head>

<body>

<header>ZAK 🔱</header>

<div class="topbar">
<div></div>
<div class="menu" onclick="toggleMenu()">⋮</div>

<div class="dropdown" id="menu">
<div onclick="filterCat('all')">الكل</div>
<div onclick="filterCat('action')">أكشن</div>
<div onclick="filterCat('fight')">قتال</div>
<div onclick="filterCat('parkour')">باركور</div>
</div>
</div>

<div class="tabs">
<button id="b1" class="active" onclick="switchTab('play')">متجر بلاي</button>
<button id="b2" onclick="switchTab('apk')">تحميل مباشر</button>
</div>

<div class="search">
<input id="search" placeholder="ابحث عن لعبة">
</div>

<div class="games" id="games"></div>

<script>

let currentTab="play";
let currentCat="all";

const playGames=[
{name:"Minecraft",cat:"action",img:"https://picsum.photos/300/200?1",link:"https://play.google.com"},
{name:"Free Fire",cat:"fight",img:"https://picsum.photos/300/200?2",link:"https://play.google.com"},
{name:"Subway Surfers",cat:"parkour",img:"https://picsum.photos/300/200?3",link:"https://play.google.com"},
{name:"PUBG Mobile",cat:"fight",img:"https://picsum.photos/300/200?4",link:"https://play.google.com"},
{name:"Roblox",cat:"action",img:"https://picsum.photos/300/200?5",link:"https://play.google.com"},
{name:"Temple Run 2",cat:"parkour",img:"https://picsum.photos/300/200?6",link:"https://play.google.com"},
{name:"Shadow Fight",cat:"fight",img:"https://picsum.photos/300/200?7",link:"https://play.google.com"},
{name:"Hill Climb Racing",cat:"action",img:"https://picsum.photos/300/200?8",link:"https://play.google.com"},
{name:"Asphalt 9",cat:"action",img:"https://picsum.photos/300/200?9",link:"https://play.google.com"},
{name:"Brawl Stars",cat:"fight",img:"https://picsum.photos/300/200?10",link:"https://play.google.com"}
];

const apkGames=[
{name:"Traffic Racer",cat:"action",img:"https://picsum.photos/300/200?11",link:"https://apkpure.com/apk-download/com.skgames.trafficracer"},
{name:"Shadow Fight",cat:"fight",img:"https://picsum.photos/300/200?12",link:"https://apkpure.com/apk-download/com.nekki.shadowfight"},
{name:"Swordigo",cat:"fight",img:"https://picsum.photos/300/200?13",link:"https://apkpure.com/apk-download/com.touchfoo.swordigo"},
{name:"Subway Surfers APK",cat:"parkour",img:"https://picsum.photos/300/200?14",link:"https://apkpure.com/apk-download/com.kiloo.subwaysurf"},
{name:"Hill Climb Racing APK",cat:"action",img:"https://picsum.photos/300/200?15",link:"https://apkpure.com/apk-download/com.fingersoft.hillclimb"}
];

function getData(){
return currentTab==="play"?playGames:apkGames;
}

function render(){
let data=getData();

let value=document.getElementById("search").value.toLowerCase();

let filtered=data.filter(g=>
g.name.toLowerCase().includes(value) &&
(currentCat==="all" || g.cat===currentCat)
);

document.getElementById("games").innerHTML=
filtered.map(g=>`
<div class="card">
<img src="${g.img}">
<h3>${g.name}</h3>
<a href="${g.link}" target="_blank">تحميل / فتح</a>
</div>
`).join("");
}

function switchTab(t){
currentTab=t;

document.getElementById("b1").classList.remove("active");
document.getElementById("b2").classList.remove("active");

if(t==="play") document.getElementById("b1").classList.add("active");
else document.getElementById("b2").classList.add("active");

render();
}

function filterCat(c){
currentCat=c;
toggleMenu();
render();
}

function toggleMenu(){
let m=document.getElementById("menu");
m.style.display = (m.style.display==="block")?"none":"block";
}

document.getElementById("search").addEventListener("input",render);

render();

</script>

</body>
</html>
