        "بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلا حَوْلَ وَلا قُوَّةَ إِلاَّ بِاللَّهِ.",
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ، أَوْ أَزِلَّ أَوْ أُزَلَّ.",
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ.",
        "بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا."
    ],
    "أذكار دخول المنزل": [
        "بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا.",
        "السَّلامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ المَوْلِجِ وَخَيْرَ المَخْرَجِ.",
        "ذِكْرُ اللَّهِ عِنْدَ الدُّخُولِ وَعِنْدَ الطَّعَامِ يَمْنَعُ الشَّيْطَانَ."
    ],
    "أذكار الذهاب إلى المسجد": [
        "اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُوراً، وَفِي بَصَرِي نُوراً، وَفِي سَمْعِي نُوراً.",
        "اللَّهُمَّ اجْعَلْ عَنْ يَمِينِي نُوراً، وَعَنْ شِمَالِي نُوراً، وَمِنْ أَمَامِي نُوراً.",
        "اللَّهُمَّ اجْعَلْ مِنْ خَلْفِي نُوراً، وَاجْعَلْ لِي نُوراً.",
        "اللَّهُمَّ عَظِّمْ لِي نُوراً، وَأَعْطِنِي نُوراً."
    ],  
    "أذكار دخول المسجد": [
        "بِسْمِ اللَّهِ، وَالصَّلاةُ وَالسَّلامُ عَلَى رَسُولِ اللَّهِ.",
        "اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ.",
        "أَعُوذُ بِاللَّهِ العَظِيمِ، وَبِوَجْهِهِ الكَرِيمِ، وَسُلْطَانِهِ القَدِيمِ، مِنَ الشَّيْطَانِ الرَّجِيمِ.",
        "اللَّهُمَّ اغْفِرْ لِي ذُنُوبِي وَافْتَحْ لِي أَبْوَابَ رَحْمَتِكَ."
    ],
    "أذكار الخروج من المسجد": [
        "بِسْمِ اللَّهِ، وَالصَّلاةُ وَالسَّلامُ عَلَى رَسُولِ اللَّهِ.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ.",
        "اللَّهُمَّ اعْصِمْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ.",
        "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ."
    ],
    "أذكار الأذان": [
        "يَقُولُ مِثْلَ مَا يَقُولُ المُؤَذِّنُ إِلاَّ فِي الحَيَّعَلَتَيْنِ فَيَقُولُ: لا حَوْلَ وَلا قُوَّةَ إِلاَّ بِاللَّهِ.",
        "وَأَنَا أَشْهَدُ أَنْ لا إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّداً عَبْدُهُ وَرَسُولُهُ.",
        "رَضِيتُ بِاللَّهِ رَبّاً، وَبِمُحَمَّدٍ رَسُولاً، وَبِالإِسْلامِ دِيناً.",
        "اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلاةِ القَائِمَةِ، آتِ مُحَمَّداً الوَسِيلَةَ وَالفَضِيلَةَ."
    ],
    "أذكار الاستخارة": [
        "اللَّهُمَّ إِنِّي أَسْتَخِيرُكَ بِعِلْمِكَ، وَأَسْتَقْدِرُكَ بِقُدْرَتِكَ، وَأَسْأَلُكَ مِنْ فَضْلِكَ العَظِيمِ.",
        "فَإِنَّكَ تَقْدِرُ وَلا أَقْدِرُ، وَتَعْلَمُ وَلا أَعْلَمُ، وَأَنْتَ عَلاَّمُ الغُيُوبِ.",
        "اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأَمْرَ خَيْرٌ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاقْدُرْهُ لِي.",
        "وَإِنْ كُنْتَ تَعْلَمُ أَنَّ هَذَا الأَمْرَ شَرٌّ لِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أَمْرِي فَاصْرِفْهُ عَنِّي."
    ],
    "أذكار الكرب والهم": [
        "لا إِلَهَ إِلاَّ اللَّهُ العَظِيمُ الحَلِيمُ، لا إِلَهَ إِلاَّ اللَّهُ رَبُّ العَرْشِ العَظِيمِ.",
        "لا إِلَهَ إِلاَّ اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الأَرْضِ وَرَبُّ العَرْشِ الكَرِيمِ.",
        "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ.",
        "اللَّهُمَّ رَحْمَتَكَ أَرْجُو فَلا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ."
    ],
    "أذكار لقاء العدو والسلطان": [
        "اللَّهُمَّ إِنَّا نَجْعَلُكَ فِي نُحُورِهِمْ، وَنَعُوذُ بِكَ مِنْ شُرُورِهِمْ.",
        "اللَّهُمَّ أَنْتَ عَضُدِي، وَأَنْتَ نَصِيرِي، بِكَ أَحُولُ وَبِكَ أَصُولُ وَبِكَ أُقَاتِلُ.",
        "حَسْبُنَا اللَّهُ وَنِعْمَ الوَكِيلُ.",
        "اللَّهُمَّ مُنْزِلَ الكِتَابِ، سَرِيعَ الحِسَابِ، اهْزِمِ الأَحْزَابَ."
    ],
    "أذكار الوسوسة في الصلاة": [
        "الأَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ (وَيَتْفُلُ عَنْ يَسَارِهِ ثَلاثاً).",
        "آمَنْتُ بِاللَّهِ وَرُسُلِهِ.",
        "هُوَ الأَوَّلُ وَالآخِرُ وَالظَّاهِرُ وَالبَاطِنُ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ.",
        "الاسْتِعَاذَةُ بِاللَّهِ مِنَ الخَنْنَبِ (شَيْطَانِ الصَّلاةِ)."
    ],
    "أذكار من أصابه شك في الإيمان": [
        "يَسْتَعِيذُ بِاللَّهِ وَيَنْتَهِي عَمَّا شَكَّ فِيهِ.",
        "يَقُولُ: آمَنْتُ بِاللَّهِ وَرُسُلِهِ.",
        "يَقْرَأُ قَوْلَهُ تَعَالَى: هُوَ الأَوَّلُ وَالآخِرُ وَالظَّاهِرُ وَالبَاطِنُ.",
        "يَسْتَعِيذُ بِاللَّهِ مِنْ شَرِّ الشَّيْطَانِ وَوَسْوَسَتِهِ."
    ],      "أذكار قضاء الدين": [
        "اللَّهُمَّ اكْفِنِي بِحَلالِكَ عَنْ حَرَامِكَ، وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ.",
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الهَمِّ وَالحَزَنِ، وَالعَجْزِ وَالكَسَلِ، وَالبُخْلِ وَالجُبْنِ، وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ.",
        "اللَّهُمَّ مَالِكَ المُلْكِ تُؤْتِي المُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ المُلْكَ مِمَّنْ تَشَاءُ، رَحْمَنَ الدُّنْيَا وَالآخِرَةِ وَرَحِيمَهُمَا، ارْحَمْنِي رَحْمَةً تُغْنِينِي بِهَا عَنْ رَحْمَةِ مَنْ سِوَاكَ.",
        "لا إِلَهَ إِلاَّ أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ."
    ],
    "أذكار الوسوسة في الصلاة والقراءة": [
        "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ (وَاتْفُلْ عَنْ يَسَارِكَ ثَلاثاً).",
        "اللَّهُمَّ أَعِذْنِي مِنْ شَيْطَانِ الصَّلاةِ (خَنْزَبٍ).",
        "آمَنْتُ بِاللَّهِ وَبِرُسُلِهِ.",
        "سُبْحَانَ اللَّهِ المَلِكِ القُدُّوسِ."
    ],
    "أذكار من استصعب عليه أمر": [
        "اللَّهُمَّ لا سَهْلَ إِلاَّ مَا جَعَلْتَهُ سَهْلاً، وَأَنْتَ تَجْعَلُ الحَزْنَ إِذَا شِئْتَ سَهْلاً.",
        "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ.",
        "حَسْبِيَ اللَّهُ وَنِعْمَ الوَكِيلُ.",
        "لا حَوْلَ وَلا قُوَّةَ إِلاَّ بِاللَّهِ العَلِيِّ العَظِيمِ."
    ],
    "أذكار ما يقول ويفعل من أذنب ذنباً": [
        "مَا مِنْ عَبْدٍ يُذْنِبُ ذَنْباً فَيُحْسِنُ الطُّهُورَ، ثُمَّ يَقُومُ فَيُصَلِّي رَكْعَتَيْنِ، ثُمَّ يَسْتَغْفِرُ اللَّهَ إِلاَّ غَفَرَ اللَّهُ لَهُ.",
        "أَسْتَغْفِرُ اللَّهَ العَظِيمَ الَّذِي لا إِلَهَ إِلاَّ هُوَ الحَيُّ القَيُّومُ وَأَتُوبُ إِلَيْهِ.",
        "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ.",
        "اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي ظُلْماً كَثِيراً وَلا يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ فَاغْفِرْ لِي مَغْفِرَةً مِنْ عِنْدِكَ."
    ],
    "أذكار طرد الشيطان ووساوسته": [
        "الاسْتِعَاذَةُ بِاللَّهِ مِنْهُ (أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ).",
        "الأَذَانُ (فَإِنَّ الشَّيْطَانَ يَفِرُّ عِنْدَ سَمَاعِهِ).",
        "قِرَاءَةُ سُورَةِ البَقَرَةِ فِي المَنْزِلِ.",
        "أَذْكَارُ الصَّبَاحِ وَالمَسَاءِ وَالنَّوْمِ."
    ],
    "أذكار من نزل به أمر يكرهه": [
        "قَدَرُ اللَّهِ وَمَا شَاءَ فَعَلَ.",
        "إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْراً مِنْهَا.",
        "الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ.",
        "حَسْبُنَا اللَّهُ وَنِعْمَ الوَكِيلُ."
    ],
    "أذكار تهنئة المولود له وجوابه": [
        "بَارَكَ اللَّهُ لَكَ فِي المَوْهُوبِ لَكَ، وَشَكَرْتَ الوَاهِبَ، وَبَلَغَ أَشُدَّهُ، وَرُزِقْتَ بِرَّهُ.",
        "وَيَرُدُّ المُهَنَّأُ: بَارَكَ اللَّهُ لَكَ وَبَارَكَ عَلَيْكَ، وَجَزَاكَ اللَّهُ خَيْراً، وَرَزَقَكَ اللَّهُ مِثْلَهُ.",
        "اللَّهُمَّ أَنْبِتْهُ نَبَاتاً حَسَناً وَاجْعَلْهُ مِنْ الصَّالِحِينَ.",
        "أُعِيذُهُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ."
    ],
    "أذكار ما يعوذ به الأولاد": [
        "أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لامَّةٍ.",
        "اللَّهُمَّ رَبَّ النَّاسِ أَذْهِبِ البَاسَ، اشْفِ أَنْتَ الشَّافِي لا شِفَاءَ إِلاَّ شِفَاؤُكَ.",
        "بِسْمِ اللَّهِ أَرْقِيكَ مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ.",
        "اللَّهُمَّ احْفَظْهُمْ بِحِفْظِكَ وَاحْرُسْهُمْ بِعَيْنِكَ الَّتِي لا تَنَامُ."
    ],    "أذكار عيادة المريض": [
        "لَا بَأْسَ طَهُورٌ إِنْ شَاءَ اللَّهُ.",
        "أَسْأَلُ اللَّهَ العَظِيمَ رَبَّ العَرْشِ العَظِيمِ أَنْ يَشْفِيَكَ. (سَبْعَ مَرَّاتٍ)",
        "بِسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ.",
        "اللَّهُمَّ رَبَّ النَّاسِ، أَذْهِبِ البَاسَ، اشْفِ أَنْتَ الشَّافِي، لا شِفَاءَ إِلاَّ شِفَاؤُكَ."
    ],
    "دعاء المريض الذي يَئِسَ مِنْ حَيَاتِهِ": [
        "اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَأَلْحِقْنِي بِالرَّفِيقِ الأَعْلَى.",
        "اللَّهُمَّ بَارِكْ لِي فِي المَوْتِ وَفِيمَا بَعْدَ المَوْتِ.",
        "لَا إِلَهَ إِلَّا اللَّهُ، إِنَّ لِلْمَوْتِ لَسَكَرَاتٍ.",
        "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ."
    ],
    "تَلْقِينُ المُحْتَضَرِ": [
        "مَنْ كَانَ آخِرُ كَلَامِهِ لَا إِلَهَ إِلَّا اللَّهُ دَخَلَ الجَنَّةَ.",
        "يُلَقَّنُ المُحْتَضَرُ قَوْلَ: لَا إِلَهَ إِلَّا اللَّهُ بِلُطْفٍ وَدُونِ إِصْرَارٍ شَدِيدٍ.",
        "إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ.",
        "اللَّهُمَّ ثَبِّتْهُ بِالقَوْلِ الثَّابِتِ فِي الحَيَاةِ الدُّنْيَا وَفِي الآخِرَةِ."
    ],
    "أذكار زيارة القبور": [
        "السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ المُؤْمِنِينَ وَالمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَلاحِقُونَ.",
        "نَسْأَلُ اللَّهَ لَنَا وَلَكُمُ العَافِيَةَ.",
        "اللَّهُمَّ لَا تَحْرِمْنَا أَجْرَهُمْ وَلَا تَفْتِنَّا بَعْدَهُمْ.",
        "رَحِمَ اللَّهُ المُسْتَقْدِمِينَ مِنَّا وَالمُسْتَأْخِرِينَ."
    ],
    "أذكار الرِّيحِ": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّهَا.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا فِيهَا وَخَيْرَ مَا أُرْسِلَتْ بِهِ.",
        "وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيهَا وَشَرِّ مَا أُرْسِلَتْ بِهِ.",
        "سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ."
    ],
    "أذكار المَطَرِ": [
        "اللَّهُمَّ صَيِّباً نَافِعاً.",
        "مُطِرْنَا بِفَضْلِ اللَّهِ وَرَحْمَتِهِ.",
        "اللَّهُمَّ حَوَالَيْنَا وَلَا عَلَيْنَا، اللَّهُمَّ عَلَى الآكَامِ وَالظِّرَابِ وَبُطُونِ الأَوْدِيَةِ وَمَنَابِتِ الشَّجَرِ.",
        "سُبْحَانَ مَنْ يُنَزِّلُ الغَيْثَ مِنْ بَعْدِ مَا قَنَطُوا وَيَنْشُرُ رَحْمَتَهُ."
    ],
    "دعاء الرَّعْدِ وَالبَرْقِ": [
        "سُبْحَانَ الَّذِي يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ وَالْمَلَائِكَةُ مِنْ خِيفَتِهِ.",
        "كَانَ عَبْدُ اللَّهِ بْنُ الزُّبَيْرِ إِذَا سَمِعَ الرَّعْدَ تَرَكَ الحَدِيثَ وَقَالَ هَذَا.",
        "اللَّهُمَّ لَا تَقْتُلْنَا بِغَضَبِكَ وَلَا تُهْلِكْنَا بِعَذَابِكَ وَعَافِنَا قَبْلَ ذَلِكَ.",
        "سُبْحَانَ مَنْ سَبَحَتْ لَهُ الرُّعُودُ وَالصَّوَاعِقُ."
    ],
    "أذكار الاستسقاء": [
        "اللَّهُمَّ أَسْقِنَا غَيْثاً مُغِيثاً مَريئاً مَرِيعاً، نَافِعاً غَيْرَ ضَارٍّ، عَاجِلاً غَيْرَ آجِلٍ.",
        "اللَّهُمَّ أغِثْنَا، اللَّهُمَّ أغِثْنَا، اللَّهُمَّ أغِثْنَا.",
        "اللَّهُمَّ سُقْيَا رَحْمَةٍ، وَلَا سُقْيَا عَذَابٍ وَلَا بَلَاءٍ وَلَا هَدْمٍ وَلَا غَرَقٍ.",
        "رَبَّنَا وَلَكَ الحَمْدُ حَمْداً كَثِيراً طَيِّباً مُبَارَكاً فِيهِ."
    ],     "أذكار رؤية الهلال": [
        "اللَّهُ أَكْبَرُ، اللَّهُمَّ أَهِلَّهُ عَلَيْنَا بِالأَمْنِ وَالإِيمَانِ، وَالسَّلامَةِ وَالإِسْلامِ.",
        "التَّوْفِيقِ لِمَا تُحِبُّ رَبَّنَا وَتَرْضَى، رَبُّنَا وَرَبُّكَ اللَّهُ.",
        "هَلالُ رُشْدٍ وَخَيْرٍ، آمَنْتُ بِالَّذِي خَلَقَكَ.",
        "الْحَمْدُ لِلَّهِ الَّذِي ذَهَبَ بِشَهْرِ كَذَا وَجَاءَ بِشَهْرِ كَذَا."
    ],
    "أذكار عند الإفطار": [
        "ذَهَبَ الظَّمَأُ وَابْتَلَّتِ العُرُوقُ، وَثَبَتَ الأَجْرُ إِنْ شَاءَ اللَّهُ.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ بِرَحْمَتِكَ الَّتِي وَسِعَتْ كُلَّ شَيْءٍ أَنْ تَغْفِرَ لِي.",
        "اللَّهُمَّ لَكَ صُمْتُ، وَعَلَى رِزْقِكَ أَفْطَرْتُ.",
        "الْحَمْدُ لِلَّهِ الَّذِي أَعَانَنِي فَصُمْتُ، وَرَزَقَنِي فَأَفْطَرْتُ."
    ],
    "أذكار قبل الطعام": [
        "بِسْمِ اللَّهِ (فِي أَوَّلِهِ).",
        "فَإِنْ نَسِيَ فِي أَوَّلِهِ فَلْيَقُلْ: بِسْمِ اللَّهِ فِي أَوَّلِهِ وَآخِرِهِ.",
        "اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ.",
        "الاجْتِمَاعُ عَلَى الطَّعَامِ وَالتَّسْمِيَةُ بَرَكَةٌ."
    ],
    "أذكار الفراغ من الطعام": [
        "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلا قُوَّةٍ.",
        "الْحَمْدُ لِلَّهِ حَمْداً كَثِيراً طَيِّباً مُبَارَكاً فِيهِ، غَيْرَ مَكْفِيٍّ وَلا مُوَدَّعٍ وَلا مُسْتَغْنًى عَنْهُ رَبَّنَا.",
        "اللَّهُمَّ أَطْعَمْتَ وَأَسْقَيْتَ وَأَغْنَيْتَ وَأَقْنَيْتَ، فَلَكَ الحَمْدُ عَلَى مَا أَعْطَيْتَ.",
        "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَ وَسَقَى، وَسَوَّغَهُ وَجَعَلَ لَهُ مَخْرَجاً."
    ],
    "دعاء الضيف لصاحب الطعام": [
        "اللَّهُمَّ بَارِكْ لَهُمْ فِيمَا رَزَقْتَهُمْ، وَاغْفِرْ لَهُمْ وَارْحَمْهُمْ.",
        "أَفْطَرَ عِنْدَكُمُ الصَّائِمُونَ، وَأَكَلَ طَعَامَكُمُ الأَبْرَارُ، وَصَلَّتْ عَلَيْكُمُ المَلائِكَةُ.",
        "اللَّهُمَّ أَطْعِمْ مَنْ أَطْعَمَنِي، وَاسْقِ مَنْ سَقَانِي.",
        "جَزَاكُمُ اللَّهُ خَيْراً وَبَارَكَ فِي أَهْلِكُمْ وَمَالِكُمْ."
    ],
    "أذكار من سُقِيَ ماءً أو لبناً": [
        "اللَّهُمَّ أَطْعِمْ مَنْ أَطْعَمَنِي وَاسْقِ مَنْ سَقَانِي.",
        "اللَّهُمَّ بَارِكْ لَنَا فِيهِ وَزِدْنَا مِنْهُ (عِنْدَ شُرْبِ اللَّبَنِ).",
        "الْحَمْدُ لِلَّهِ الَّذِي سَقَانَا عَذْباً فُرَاتاً بِرَحْمَتِهِ.",
        "سَقَاكَ اللَّهُ مِنْ حَوْضِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ."
    ],
    "أذكار العطاس": [
        "يَقُولُ العَاطِسُ: الْحَمْدُ لِلَّهِ.",
        "يَقُولُ لَهُ أَخُوهُ: يَرْحَمُكَ اللَّهُ.",
        "فَيَرُدُّ العَاطِسُ: يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ.",
        "إِذَا كَرَّرَ العَاطِسُ أَكْثَرَ مِنْ ثَلاَثٍ فَهُمَ مَزْكُومٌ."
    ],
    "أذكار ما يقال للمتزوج": [
        "بَارَكَ اللَّهُ لَكَ، وَبَارَكَ عَلَيْكَ، وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ.",
        "على الخَيْرِ وَالبَرَكَةِ، وَعَلَى خَيْرِ طَائِرٍ.",
        "اللَّهُمَّ بَارِكْ لَهُمَا وَبَارِكْ عَلَيْهِمَا وَاجْمَعْ بَيْنَهُمَا فِي خَيْرٍ.",
        "اللَّهُمَّ ارْزُقْهُمَا الذُّرِّيَّةَ الصَّالِحَةَ."
    ],     "دعاء المتزوج إذا دخلت عليه زوجته": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَهَا وَخَيْرَ مَا جَبَلْتَهَا عَلَيْهِ.",
        "وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَمِنْ شَرِّ مَا جَبَلْتَهَا عَلَيْهِ.",
        "اللَّهُمَّ بَارِكْ لِي فِي أَهْلِي وَبَارِكْ لَهُمْ فِيَّ.",
        "اللَّهُمَّ اجْمَعْ بَيْنَنَا مَا جَمَعْتَ فِي خَيْرٍ."
    ],
    "دعاء قبل إتيان الزوجة": [
        "بِسْمِ اللَّهِ، اللَّهُمَّ جَنِّبْنَا الشَّيْطَانَ، وَجَنِّبِ الشَّيْطَانَ مَا رَزَقْتَنَا.",
        "فَإِنَّهُ إِنْ يُقَدَّرْ بَيْنَهُمَا وَلَدٌ فِي ذَلِكَ لَمْ يَضُرَّهُ شَيْطَانٌ أَبَداً.",
        "التَّسْمِيَةُ عِنْدَ أَيِّ عَمَلٍ تَطْرُدُ الشَّيْطَانَ.",
        "اللَّهُمَّ اجْعَلْهُ ذُرِّيَّةً طَيِّبَةً صَالِحَةً."
    ],
    "دعاء الغضب": [
        "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ.",
        "اللَّهُمَّ اغْفِرْ ذَنْبِي، وَأَذْهِبْ غَيْظَ قَلْبِي، وَأَجِرْنِي مِنَ الشَّيْطَانِ.",
        "إِذَا غَضِبَ أَحَدُكُمْ فَلْيَسْكُتْ.",
        "الوُضُوءُ يُطْفِئُ جَمْرَةَ الغَضَبِ."
    ],
    "دعاء من رأى مبتلى": [
        "الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي مِمَّا ابْتَلاَكَ بِهِ، وَفَضَّلَنِي عَلَى كَثِيرٍ مِمَّنْ خَلَقَ تَفْضِيلاً.",
        "يَقُولُهَا فِي نَفْسِهِ وَلا يُسْمِعُ المُبْتَلَى لِئَلا يَحْزَنَ.",
        "الشُّكْرُ عَلَى العَافِيَةِ يَدُومُ بِهِ الفَضْلُ.",
        "اللَّهُمَّ ارْحَمْ كُلَّ مُبْتَلًى وَاشْفِ كُلَّ مَرِيضٍ."
    ],
    "ما يقال في المَجْلِسِ": [
        "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الغَفُورُ (مِئَةَ مَرَّةٍ).",
        "الاسْتِغْفَارُ فِي المَجَالِسِ يَمْحُو اللَّغْوَ.",
        "اللَّهُمَّ اقْسِمْ لَنَا مِنْ خَشْيَتِكَ مَا تَحُولُ بِهِ بَيْنَنَا وَبَيْنَ مَعَاصِيكَ.",
        "اللَّهُمَّ مَتِّعْنَا بِأَسْمَاعِنَا وَأَبْصَارِنَا وَقُوَّاتِنَا مَا أَحْيَيْتَنَا."
    ],
    "كفارة المَجْلِسِ": [
        "سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ، أَشْهَدُ أَنْ لا إِلَهَ إِلاَّ أَنْتَ، أَسْتَغْفِرُكَ وَأَتُوبُ إِلَيْكَ.",
        "تُقَالُ عِنْدَ القِيَامِ مِنْ أَيِّ مَجْلِسٍ لِتَكْفِيرِ مَا كَانَ فِيهِ.",
        "تَكُونُ كَالطَّابَعِ عَلَى المَجْلِسِ الصَّالِحِ.",
        "تَغْفِرُ مَا يَقَعُ فِي المَجْلِسِ مِنْ زَلَلٍ أَوْ هَفَوَاتٍ."
    ],
    "الدعاء لمن قال غفر الله لك": [
        "وَلَكَ (أَوْ: وَغَفَرَ اللَّهُ لَكَ أَيْضاً).",
        "اللَّهُمَّ اغْفِرْ لَنَا وَلَهُ وَلِجَمِيعِ المُسْلِمِينَ.",
        "جَزَاكَ اللَّهُ خَيْراً وَغَفَرَ ذَنْبَكَ.",
        "تَبَادُلُ الدُّعَاءِ يَزِيدُ المَوَدَّةَ بَيْنَ المُؤْمِنِينَ."
    ],
    "الدعاء لمن صنع إليك معروفاً": [
        "جَزَاكَ اللَّهُ خَيْراً.",
        "فَمَنْ قَالَهَا فَقَدْ أَبْلَغَ فِي الثَّنَاءِ.",
        "اللَّهُمَّ بَارِكْ لَهُ فِي مَالِهِ وَأَهْلِهِ وَاجْزِهِ عَنَّا خَيْرَ الجَزَاءِ.",
        "شُكْرُ المَعْرُوفِ مِنْ حُسْنِ الخُلُقِ وَالإِيمَانِ."
    ],    "ما يعصم الله به من الدجال": [
        "حِفْظُ عَشْرِ آيَاتٍ مِنْ أَوَّلِ سُورَةِ الكَهْفِ.",
        "الاسْتِعَاذَةُ بِاللَّهِ مِنْ فِتْنَةِ المَسِيحِ الدَّجَّالِ فِي دُبُرِ كُلِّ صَلاةٍ.",
        "التَّعَوُّذُ مِنَ الفِتَنِ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ.",
        "السَّكَنُ فِي المَدِينَةِ أَوْ مَكَّةَ فَإِنَّ الدَّجَّالَ لا يَدْخُلُهُمَا."
    ],
    "الدعاء لمن قال إني أحبك في الله": [
        "أَحَبَّكَ الَّذِي أَحْبَبْتَنِي لَهُ.",
        "اللَّهُمَّ حَبِّبْهُ إِلَيْكَ وَإِلَى عِبَادِكَ الصَّالِحِينَ.",
        "جَزَاكَ اللَّهُ خَيْراً وَأَظَلَّكَ اللَّهُ فِي ظِلِّهِ يَوْمَ لا ظِلَّ إِلاَّ ظِلُّهُ.",
        "المَحَبَّةُ فِي اللَّهِ مِنْ أَعْظَمِ عُرَى الإِيمَانِ."
    ],
    "الدعاء لمن عرض عليك ماله": [
        "بَارَكَ اللَّهُ لَكَ فِي أَهْلِكَ وَمَالِكَ.",
        "إِنَّمَا جَزَاءُ السَّلَفِ الحَمْدُ وَالأَدَاءُ.",
        "اللَّهُمَّ أَخْلِفْ عَلَيْهِ خَيْراً مِمَّا أَنْفَقَ.",
        "جَزَاكَ اللَّهُ خَيْراً عَلَى كَرَمِكَ وَحُسْنِ خُلُقِكَ."
    ],
    "الدعاء لمن أقرض عند القضاء": [
        "بَارَكَ اللَّهُ لَكَ فِي أَهْلِكَ وَمَالِكَ، إِنَّمَا جَزَاءُ السَّلَفِ الحَمْدُ وَالأَدَاءُ.",
        "جَزَاكَ اللَّهُ خَيْراً وَأَوْفَى لَكَ الأَجْرَ.",
        "اللَّهُمَّ بَارِكْ لَهُ فِي رِزْقِهِ وَوَسِّعْ عَلَيْهِ.",
        "قَضَاءُ الدَّيْنِ بِالإِحْسَانِ مِنْ شِيَمِ الكِرَامِ."
    ],
    "دعاء الخوف من الشرك": [
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أُشْرِكَ بِكَ وَأَنَا أَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا لا أَعْلَمُ.",
        "اللَّهُمَّ طَهِّرْ قَلْبِي مِنَ الرِّيَاءِ وَعَمَلِي مِنَ الشِّرْكِ.",
        "اللَّهُمَّ اجْعَلْ أَعْمَالِي كُلَّهَا صَالِحَةً وَلِوَجْهِكَ خَالِصَةً.",
        "الإِخْلاصُ هُوَ أَسَاسُ قَبُولِ الأَعْمَالِ."
    ],
    "الدعاء لمن قال بارك الله فيك": [
        "وَفِيكَ بَارَكَ اللَّهُ.",
        "اللَّهُمَّ بَارِكْ لَنَا وَلَهُ فِي كُلِّ خَيْرٍ.",
        "جَزَاكَ اللَّهُ خَيْراً وَأَعْظَمَ لَكَ الأَجْرَ.",
        "تَبَادُلُ البَرَكَةِ يَنْشُرُ المَوَدَّةَ وَالتَّآخِيَ."
    ],
    "دعاء كراهية الطيرة": [
        "اللَّهُمَّ لا طَيْرَ إِلاَّ طَيْرُكَ، وَلا خَيْرَ إِلاَّ خَيْرُكَ، وَلا إِلَهَ غَيْرُكَ.",
        "اللَّهُمَّ لا يَأْتِي بِالحَسَنَاتِ إِلاَّ أَنْتَ، وَلا يَدْفَعُ السَّيِّئَاتِ إِلاَّ أَنْتَ.",
        "التَّوَكُّلُ عَلَى اللَّهِ يَمْحُو كُلَّ تَطَيُّرٍ أَوْ شُؤْمٍ.",
        "لا حَوْلَ وَلا قُوَّةَ إِلاَّ بِاللَّهِ العَلِيِّ العَظِيمِ."
    ],
    "دعاء الركوب": [
        "بِسْمِ اللَّهِ، الْحَمْدُ لِلَّهِ، {سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ * وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ}.",
        "الْحَمْدُ لِلَّهِ (ثَلاثاً)، اللَّهُ أَكْبَرُ (ثَلاثاً)، سُبْحَانَكَ اللَّهُمَّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي.",
        "فَإِنَّهُ لا يَغْفِرُ الذُّنُوبَ إِلاَّ أَنْتَ.",
        "اللَّهُمَّ إنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا البِرَّ وَالتَّقْوَى."
    ],    "دعاء السفر": [
        "اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، اللَّهُ أَكْبَرُ، {سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ * وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ}.",
        "اللَّهُمَّ إِنَّا نَسْأَلُكَ فِي سَفَرِنَا هَذَا البِرَّ وَالتَّقْوَى، وَمِنَ العَمَلِ مَا تَرْضَى.",
        "اللَّهُمَّ هَوِّنْ عَلَيْنَا سَفَرَنَا هَذَا وَاطْوِ عَنَّا بُعْدَهُ، اللَّهُمَّ أَنْتَ الصَّاحِبُ فِي السَّفَرِ، وَالخَلِيفَةُ فِي الأَهْلِ.",
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ وَعْثَاءِ السَّفَرِ، وَكَآبَةِ المَنْظَرِ، وَسُوءِ المُنْقَلَبِ فِي المَالِ وَالأَهْلِ."
    ],
    "دعاء دخول القرية أو المدينة": [
        "اللَّهُمَّ رَبَّ السَّمَاوَاتِ السَّبْعِ وَمَا أَظْلَلْنَ، وَرَبَّ الأَرَضِينَ السَّبْعِ وَمَا أَقْلَلْنَ.",
        "وَرَبَّ الشَّيَاطِينِ وَمَا أَضْلَلْنَ، وَرَبَّ الرِّيَاحِ وَمَا ذَرَيْنَ.",
        "أسْأَلُكَ خَيْرَ هَذِهِ القَرْيَةِ وَخَيْرَ أَهْلِهَا وَخَيْرَ مَا فِيهَا.",
        "وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ أَهْلِهَا وَشَرِّ مَا فِيهَا."
    ],
    "دعاء دخول السوق": [
        "لا إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ، يُحْيِي وَيُمِيتُ وَهُوَ حَيٌّ لا يَمُوتُ.",
        "بِيَدِهِ الخَيْرُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",
        "كَتَبَ اللَّهُ لَهُ أَلْفَ أَلْفِ حَسَنَةٍ وَمَحَا عَنْهُ أَلْفَ أَلْفِ سَيِّئَةٍ.",
        "وَرَفَعَ لَهُ أَلْفَ أَلْفِ دَرَجَةٍ وَبَنَى لَهُ بَيْتاً فِي الجَنَّةِ."
    ],
    "الدعاء إذا تعس المركوب": [
        "بِسْمِ اللَّهِ.",
        "التَّسْمِيَةُ تَطْرُدُ الشَّيْطَانَ وَتَصْغُرُهُ حَتَّى يَكُونَ كَالذُّبَابِ.",
        "اللَّهُمَّ سَلِّمْنَا وَاحْفَظْنَا فِي سَيْرِنَا.",
        "لا حَوْلَ وَلا قُوَّةَ إِلاَّ بِاللَّهِ العَلِيِّ العَظِيمِ."
    ],
    "دعاء المسافر للمقيم": [
        "أَسْتَوْدِعُكُمُ اللَّهَ الَّذِي لا تَضِيعُ وَدَائِعُهُ.",
        "أَسْتَوْدِعُ اللَّهَ دِينَكُمْ وَأَمَانَتَكُمْ وَخَوَاتِيمَ أَعْمَالِكُمْ.",
        "حَفِظَكُمُ اللَّهُ فِي غَيْبَتِكُمْ وَسَلَّمَكُمْ مِنْ كُلِّ سُوءٍ.",
        "جَمَعَنَا اللَّهُ وَإِيَّاكُمْ عَلَى خَيْرٍ وَطَاعَةٍ."
    ],
    "دعاء المقيم للمسافر": [
        "أَسْتَوْدِعُ اللَّهَ دِينَكَ وَأَمَانَتَكَ وَخَوَاتِيمَ عَمَلِكَ.",
        "زَوَّدَكَ اللَّهُ التَّقْوَى، وَغَفَرَ ذَنْبَكَ، وَيَسَّرَ لَكَ الخَيْرَ حَيْثُمَا كُنْتَ.",
        "سَالِماً غَانِماً إِنْ شَاءَ اللَّهُ.",
        "رَافَقَتْكَ السَّلاَمَةُ فِي حَلِّكَ وَتَرْحَالِكَ."
    ],
    "التكبير والتسبيح في سير السفر": [
        "كُنَّا إِذَا صَعِدْنَا كَبَّرْنَا (اللَّهُ أَكْبَرُ).",
        "وَإِذَا نَزَلْنَا سَبَّحْنَا (سُبْحَانَ اللَّهِ).",
        "التَّكْبِيرُ عِنْدَ العُلُوِّ وَالأَمَاكِنِ المُرْتَفِعَةِ.",
        "التَّسْبِيحُ عِنْدَ الهُبُوطِ وَالأَوْدِيَةِ."
    ],
    "دعاء المسافر إذا أسرَحَ أو أفْجَر": [
        "سَمِعَ سَامِعٌ بِحَمْدِ اللَّهِ وَحُسْنِ بَلاَئِهِ عَلَيْنَا.",
        "رَبَّنَا صَاحِبْنَا وَأَفْضِلْ عَلَيْنَا، عَائِذاً بِاللَّهِ مِنَ النَّارِ.",
        "يُقَالُ فِي آخِرِ اللَّيْلِ أَوْ عِنْدَ إِشْرَاقِ الفَجْرِ فِي السَّفَرِ.",
        "اللَّهُمَّ أَعِنَّا عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ."
    ],     "دعاء إذا نزل منزلاً في سفر أو غيره": [
        "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.",
        "مَنْ نَزَلَ مَنْزِلاً ثُمَّ قَالَ هَذَا لَمْ يَضُرَّهُ شَيْءٌ حَتَّى يَرْتَحِلَ.",
        "اللَّهُمَّ أَنْزِلْنِي مُنْزَلاً مُبَارَكاً وَأَنْتَ خَيْرُ المُنْزِلِينَ.",
        "الاحْتِمَاءُ بِكَلِمَاتِ اللَّهِ يَحْمِي مِنَ الدَّوَابِّ وَالسِّبَاعِ وَكُلِّ شَرٍّ."
    ],
    "ذكر الرجوع من السفر": [
        "آيِبُونَ تَائِبُونَ عَابِدُونَ لِرَبِّنَا حَامِدُونَ.",
        "لا إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",
        "صَدَقَ اللَّهُ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الأَحْزَابَ وَحْدَهُ.",
        "يُكَرِّرُهَا المُسَافِرُ حَتَّى يَدْخُلَ بَيْتَهُ."
    ],
    "ما يقول من أتاه أمر يسره أو يكرهه": [
        "إِذَا أَتَاهُ مَا يَسُرُّهُ قَالَ: الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ.",
        "وَإِذَا أَتَاهُ مَا يَكْرَهُهُ قَالَ: الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ.",
        "الشُّكْرُ فِيهِ إِظْهَارُ الرِّضَا بِقَضَاءِ اللَّهِ فِي السَّرَّاءِ وَالضَّرَّاءِ.",
        "اللَّهُمَّ لَكَ الحَمْدُ كُلُّهُ وَلَكَ الشُّكْرُ كُلُّهُ."
    ],
    "فضل الصلاة على النبي": [
        "مَنْ صَلَّى عَلَيَّ صَلاةً صَلَّى اللَّهُ عَلَيْهِ بِهَا عَشْراً.",
        "الصَّلاةُ عَلَى النَّبِيِّ تُزِيلُ الهُمُومَ وَتَغْفِرُ الذُّنُوبَ.",
        "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ.",
        "أَوْلَى النَّاسِ بِالنَّبِيِّ يَوْمَ القِيَامَةِ أَكْثَرُهُمْ عَلَيْهِ صَلاةً."
    ],
    "إفشاء السلام": [
        "لا تَدْخُلُونَ الجَنَّةَ حَتَّى تُؤْمِنُوا، وَلا تُؤْمِنُوا حَتَّى تَحَابُّوا، أَوَلا أَدُلُّكُمْ عَلَى شَيْءٍ إِذَا فَعَلْتُمُوهُ تَحَابَبْتُمْ؟ أَفْشُوا السَّلامَ بَيْنَكُمْ.",
        "السَّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ.",
        "إِفْشَاءُ السَّلامِ يَنْشُرُ المَحَبَّةَ وَالأَمْنَ بَيْنَ النَّاسِ.",
        "تَ حِيَّةُ أَهْلِ الجَنَّةِ السَّلامُ."
    ],
    "كيف يرد السلام على الكافر إذا سلم": [
        "وَعَلَيْكُمْ.",
        "لا تَبْدَءُوا اليَهُودَ وَلا النَّصَارَى بِالسَّلامِ.",
        "إِذَا سَلَّمَ أَهْلُ الكِتَابِ فَقُولُوا: وَعَلَيْكُمْ.",
        "العَدْلُ وَالحِكْمَةُ فِي المَعَامَلَةِ وَالرَّدِّ."
    ],
    "صياح الديك ونهيق الحمار": [
        "إِذَا سَمِعْتُمْ صِيَاحَ الدِّيَكَةِ فَاسْأَلُوا اللَّهَ مِنْ فَضْلِهِ، فَإِنَّهَا رَأَتْ مَلَكاً.",
        "وَإِذَا سَمِعْتُمْ نَهِيقَ الحِمَارِ فَتَعَوَّذُوا بِاللَّهِ مِنَ الشَّيْطَانِ، فَإِنَّهُ رَأَى شَيْطَاناً.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ وَرَحْمَتِكَ.",
        "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ."
    ],
    "نباح الكلاب بالليل": [
        "إِذَا سَمِعْتُمْ نُبَاحَ الكِلابِ وَنَهِيقَ الحُمُرِ بِاللَّيْلِ فَتَعَوَّذُوا بِاللَّهِ مِنْهُنَّ.",
        "فَإِنَّهُنَّ يَرَيْنَ مَا لا تَرَوْنَ.",
        "أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ.",
        "الذِّكْرُ حِصْنٌ لِلْمُؤْمِنِ فِي الظُّلُمَاتِ."
    ],    "الدعاء لمن سبَبْتَهُ": [
        "اللَّهُمَّ فَأَيُّمَا مُؤْمِنٍ سَبَبْتُهُ فَاجْعَلْ ذَلِكَ لَهُ قُرْبَةً إِلَيْكَ يَوْمَ القِيَامَةِ.",
        "اللَّهُمَّ اجْعَلْهَا لَهُ زَكَاةً وَرَحْمَةً وَطَهُوراً.",
        "الاعْتِرَافُ بِالخَطَأِ وَالدُّعَاءُ لِلْمَظْلُومِ يُصْلِحُ القُلُوبَ.",
        "اللَّهُمَّ اغْفِرْ لَنَا وَلِمَنْ أَسَأْنَا إِلَيْهِ."
    ],
    "ما يقول المسلم إذا مدح المسلم": [
        "أَحْسِبُ فُلاَناً، وَاللَّهُ حَسِيبُهُ، وَلا أُزَكِّي عَلَى اللَّهِ أَحَداً.",
        "إِنْ كَانَ يَعْلَمُ ذَلِكَ مِنْهُ فَلْيَقُلْ أَحْسِبُهُ كَذَا وَكَذَا.",
        "الاعْتِدَالُ فِي المَدْحِ يَقِي مِنَ الكِبْرِ وَالعُجْبِ.",
        "اللَّهُمَّ لا تُؤَاخِذْنِي بِمَا يَقُولُونَ وَاغْفِرْ لِي مَا لا يَعْلَمُونَ."
    ],
    "ما يقول المسلم إذا زُكِّيَ": [
        "اللَّهُمَّ لا تُؤَاخِذْنِي بِمَا يَقُولُونَ، وَاغْفِرْ لِي مَا لا يَعْلَمُونَ.",
        "وَاجْعَلْنِي خَيْراً مِمَّا يَظُنُّونَ.",
        "التَّوَاضُعُ لِلَّهِ عِنْدَ المَدْحِ مِنْ صِفَاتِ المُؤْمِنِينَ.",
        "سَتْرُ اللَّهِ عَلَى العَبْدِ هُوَ جَمَالُهُ الحَقِيقِيُّ."
    ],
    "كيف يلبي المحرم في الحج أو العمرة": [
        "لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لا شَرِيكَ لَكَ لَبَّيْكَ.",
        "إِنَّ الحَمْدَ وَالنِّعْمَةَ لَكَ وَالمُلْكَ، لا شَرِيكَ لَكَ.",
        "التَّلْبِيَةُ هِيَ شِعَارُ التَّوْحِيدِ فِي الحَجِّ وَالعُمْرَةِ.",
        "يَرْفَعُ الرِّجَالُ أَصْوَاتَهُمْ بِالتَّلْبِيَةِ إِعْلاَناً لِلتَّوْحِيدِ."
    ],
    "التكبير إذا أتى الحجر الأسود": [
        "طَافَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ بِالْبَيْتِ عَلَى بَعِيرٍ، كُلَّمَا أَتَى الرُّكْنَ أَشَارَ إِلَيْهِ بِشَيْءٍ عِنْدَهُ وَكَبَّرَ.",
        "اللَّهُ أَكْبَرُ عِنْدَ اسْتِلاَمِ الحَجَرِ أَوْ الإِشَارَةِ إِلَيْهِ.",
        "اتِّبَاعُ السُّنَّةِ فِي الطَّوَافِ يَعْظُمُ بِهِ الأَجْرُ.",
        "بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ."
    ],
    "الدعاء بين الركن اليماني والحجر الأسود": [
        "{رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ}.",
        "يُسْتَحَبُّ الدُّعَاءُ بِهَذِهِ الآيَةِ فِي كُلِّ طَوْفَةٍ بَيْنَ الرُّكْنَيْنِ.",
        "جَمَعَتْ هَذِهِ الدَّعْوَةُ خَيْرَيِ الدُّنْيَا وَالآخِرَةِ.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ العَفْوَ وَالعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ."
    ],
    "دعاء الوقوف على الصفا والمروة": [
        "يَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ: {إِنَّ الصَّفَا وَالمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ...}.",
        "لا إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",
        "لا إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ، أَنْجَزَ وَعْدَهُ، وَنَصَرَ عَبْدَهُ، وَهَزَمَ الأَحْزَابَ وَحْدَهُ.",
        "يَقُولُ ذَلِكَ ثَلاَثَ مَرَّاتٍ وَيَدْعُو بَيْنَهُنَّ بِمَا شَاءَ."
    ],
    "الدعاء يوم عرفة": [
        "خَيْرُ الدُّعَاءِ دُعَاءُ يَوْمِ عَرَفَةَ.",
        "وَخَيْرُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِنْ قَبْلِي: لا إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",
        "يَوْمُ عَرَفَةَ مِنْ أَعْظَمِ أَيَّامِ السَّنَةِ لإِجَابَةِ الدُّعَاءِ.",
        "اللَّهُمَّ اعْتِقْ رِقَابَنَا مِنَ النَّارِ فِي هَذَا اليَوْمِ العَظِيمِ."
    ],    "الذكر عند المشعر الحرام": [
        "يَرْكَبُ الحَبِيَبَ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ القَصْوَاءَ حَتَّى أَتَى المَشْعَرَ الحَرَامَ فَاسْتَقْبَلَ القِبْلَةَ.",
        "فَدَعَاهُ وَكَبَّرَهُ وَهَلَّلَهُ وَوَحَّدَهُ.",
        "فَلَمْ يَزَلْ وَاقِفاً حَتَّى أَسْفَرَ جِدّاً.",
        "فَدَفَعَ قَبْلَ أَنْ تَطْلُعَ الشَّمْسُ."
    ],
    "التكبير عند رمي الجمار مع كل حصاة": [
        "يُكَبِّرُ كُلَّمَا رَمَى بِحَصَاةٍ عِنْدَ الجِمَارِ الثَّلاَثِ.",
        "اللَّهُ أَكْبَرُ مَعَ كُلِّ حَصَاةٍ.",
        "ثُمَّ يَتَقَدَّمُ وَيَقِفُ يَدْعُو مُسْتَقْبِلَ القِبْلَةِ رَافِعاً يَدَيْهِ بَعْدَ الجَمْرَةِ الأُولَى وَالثَّانِيَةِ.",
        "وَلا يَقِفُ عِنْدَ جَمْرَةِ العَقَبَةِ العُظْمَى."
    ],
    "دعاء التعجب والأمر السار": [
        "سُبْحَانَ اللَّهِ!",
        "اللَّهُ أَكْبَرُ!",
        "لا إِلَهَ إِلاَّ اللَّهُ!",
        "الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ."
    ],
    "ما يفعل من أتاه أمر يسرّه": [
        "كَانَ النَّبِيُّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ إِذَا أَتَاهُ أَمْرٌ يَسُرُّهُ أَوْ بُشِّرَ بِهِ خَرَّ سَاجِداً شُكْراً لِلَّهِ تَبَارَكَ وَتَعَالَى.",
        "سَجْدَةُ الشُّكْرِ تُؤَدَّى عِنْدَ تَجَدُّدِ النِّعَمِ أَوْ انْدِفَاعِ النِّقَمِ.",
        "الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ.",
        "الشُّكْرُ سَبَبٌ لِزِيَادَةِ النِّعَمِ وَدَوَامِهَا."
    ],
    "ما يقول من أحس بوجع في جسده": [
        "ضَعْ يَدَكَ عَلَى الَّذِي تَلَمَّمَ مِنْ جَسَدِكَ وَقُلْ: بِسْمِ اللَّهِ (ثَلاَثاً).",
        "وَقُلْ سَبْعَ مَرَّاتٍ: أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ.",
        "الرُّقْيَةُ الذَّاتِيَّةُ بِالأَذْكَارِ فِيهَا شِفَاءٌ وَبَرَكَةٌ.",
        "اللَّهُمَّ رَبَّ النَّاسِ أَذْهِبِ البَاسَ وَاشْفِ أَنْتَ الشَّافِي."
    ],
    "دعاء من خاف أن يصيب شيئاً بعينه": [
        "إِذَا رَأَى أَحَدُكُمْ مِنْ أَخِيهِ أَوْ مِنْ نَفْسِهِ أَوْ مِنْ مَالِهِ مَا يُعْجِبُهُ فَلْيُبَرِّكْ عَلَيْهِ.",
        "اللَّهُمَّ بَارِكْ فِيهِ / مَا شَاءَ اللَّهُ لا قُوَّةَ إِلاَّ بِاللَّهِ.",
        "التَّبْرِيكُ يَدْفَعُ أَثَرَ العَيْنِ وَالحَسَدِ.",
        "تَبَارَكَ اللَّهُ أَحْسَنُ الخَالِقِينَ."
    ],
    "ما يقال عند الفزع": [
        "لا إِلَهَ إِلاَّ اللَّهُ!",
        "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ غَضَبِهِ وَعِقَابِهِ وَشَرِّ عِبَادِهِ.",
        "وَمِنْ هَمَزَاتِ الشَّيَاطِينِ وَأَنْ يَحْضُرُونِ.",
        "اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي."
    ],
    "ما يقول عند الذبح أو النحر": [
        "بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ.",
        "اللَّهُمَّ مِنْكَ وَإِلَيْكَ، اللَّهُمَّ تَقَبَّلْ مِنِّي (أَوْ مِنْ فُلاَنٍ).",
        "التَّسْمِيَةُ وَالتَّكْبِيرُ شَرْطٌ وَسُنَّةٌ عِنْدَ الذَّبْحِ.",
        "اللَّهُمَّ هَذَا عَنِّي وَعَنْ أَهْلِ بَيْتِي."
    ],
    "ما يقول لرد كيد مردة الشياطين": [
        "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ الَّتِي لا يُجَاوِزُهُنَّ بَرٌّ وَلا فَاجِرٌ مِنْ شَرِّ مَا خَلَقَ وَذَرَأَ وَبَرَأَ.",
        "وَمِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ وَمِنْ شَرِّ مَا يَعْرُجُ فِيهَا.",
        "وَمِنْ شَرِّ مَا ذَرَأَ فِي الأَرْضِ وَمِنْ شَرِّ مَا يَخْرُجُ مِنْهَا.",
        "وَمِنْ شَرِّ فِتَنِ اللَّيْلِ وَالنَّهَارِ وَمِنْ شَرِّ كُلِّ طَارِقٍ إِلاَّ طَارِقاً يَطْرُقُ بِخَيْرٍ يَا رَحْمَنُ."
    ],
    "الاستغفار والتوبة": [
        "أَسْتَغْفِرُ اللَّهَ الَّذِي لا إِلَهَ إِلاَّ هُوَ الحَيُّ القَيُّومُ وَأَتُوبُ إِلَيْهِ (ثَلاَثاً).",
        "إِنَّهُ لَيُغَانُ عَلَى قَلْبِي وَإِنِّي لأَسْتَغْفِرُ اللَّهَ فِي اليَوْمِ مِئَةَ مَرَّةٍ.",
        "وَاللَّهِ إِنِّي لأَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ فِي اليَوْمِ أَكْثَرَ مِنْ سَبْعِينَ مَرَّةً.",
        "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ."
    ],
    "فضل التسبيح والتحميد والتهليل والتكبير": [
        "مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِئَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ البَحْرِ.",
        "كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي المِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ العَظِيمِ.",
        "أَحَبُّ الكَلاَمِ إِلَى اللَّهِ أَرْبَعٌ: سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلا إِلَهَ إِلاَّ اللَّهُ، وَاللَّهُ أَكْبَرُ.",
        "لَأَنْ أَقُولَ سُبْحَانَ اللَّهِ وَالْحَمْدُ لِلَّهِ وَلا إِلَهَ إِلاَّ اللَّهُ وَاللَّهُ أَكْبَرُ أَحَبُّ إِلَيَّ مِمَّا طَلَعَتْ عَلَيْهِ الشَّمْسُ."
    ],    "كيف كان النبي يسبح": [
        "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو رَضِيَ اللَّهُ عَنْهُمَا قَالَ: رَأَيْتُ النَّبِيَّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ يَعْقِدُ التَّسْبِيحَ بِيَمِينِهِ.",
        "عَقْدُ التَّسْبِيحِ بِالأَصَابِعِ يُسَنُّ بِالْيَدِ الْيُمْنَى.",
        "الأَصَابِعُ مُسْتَنْطَقَاتٌ وَشَاهِدَاتٌ يَوْمَ الْقِيَامَةِ.",
        "السُّنَّةُ الاِقْتِدَاءُ بِهَدْيِهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ فِي الذِّكْرِ."
    ],
    "من أنواع الخير والجامع لآداب الدعاء": [
        "إِذَا دَعَا أَحَدُكُمْ فَلْيَبْدَأْ بِتَحْمِيدِ اللَّهِ وَالثَّنَاءِ عَلَيْهِ ثُمَّ لْيُصَلِّ عَلَى النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.",
        "ثُمَّ لْيَدْعُ بَعْدُ بِمَا شَاءَ.",
        "الْجَزْمُ فِي الدُّعَاءِ وَعَدَمُ الاِسْتِعْجَالِ مِنْ أَسْبَابِ الإِجَابَةِ.",
        "حُضُورُ الْقَلْبِ وَالتَّضَرُّعُ وأَكْلُ الْحَلاَلِ أَعْظَمُ شُرُوطِ الدُّعَاءِ."
    ],
    "دعاء ختم القرآن الكريم": [
        "اللَّهُمَّ ارْحَمْنِي بِالْقُرْآنِ وَاجْعَلْهُ لِي إِمَاماً وَنُوراً وَهُدًى وَرَحْمَةً.",
        "اللَّهُمَّ ذَكِّرْنِي مِنْهُ مَا نَسِيتُ وَعَلِّمْنِي مِنْهُ مَا جَهِلْتُ وَارْزُقْنِي تِلاَوَتَهُ آنَاءَ اللَّيْلِ وَأَطْرَافَ النَّهَارِ.",
        "وَاجْعَلْهُ لِي حُجَّةً يَا رَبَّ الْعَالَمِينَ.",
        "اللَّهُمَّ أَصْلِحْ لِي دِينِي الَّذِي هُوَ عِصْمَةُ أَمْرِي وَأَصْلِحْ لِي دُنْيَايَ الَّتِي فِيهَا مَعَاشِي."
    ],
    "أذكار الشفاء والمرض": [
        "اللَّهُمَّ رَبَّ النَّاسِ، أَذْهِبِ الْبَاسَ، اشْفِ أَنْتَ الشَّافِي، لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ، شِفَاءً لاَ يُغَادِرُ سَقَماً.",
        "بِسْمِ اللَّهِ أَرْقِيكَ مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ اللَّهُ يَشْفِيكَ.",
        "أَسْأَلُ اللَّهَ الْعَظِيمَ رَبَّ الْعَرْشِ الْعَظِيمِ أَنْ يَشْفِيَكَ (سَبْعَ مَرَّاتٍ).",
        "الرُّقْيَةُ بِالْمُعَوِّذَاتِ وَالْفَاتِحَةِ سُنَّةٌ ثَابِتَةٌ."
    ],
    "دعاء صلاة الضحى": [
        "اللَّهُمَّ إِنَّ الضُّحَاءَ ضُحَاؤُكَ، وَالْبَهَاءَ بَهَاؤُكَ، وَالْجَمَالَ جَمَالُكَ.",
        "وَالْقُوَّةَ قُوَّتُكَ، وَالْقُدْرَةَ قُدْرَتُكَ، وَالْعِصْمَةَ عِصْمَتُكَ.",
        "اللَّهُمَّ إِنْ كَانَ رِزْقِي فِي السَّمَاءِ فَأَنْزِلْهُ، وَإِنْ كَانَ فِي الأَرْضِ فَأَخْرِجْهُ.",
        "رَبِّ اغْفِرْ لِي وَتُبْ عَلَيَّ إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ (يُكَرِّرُهَا فِيهَا)."
    ],
    "أذكار حفظ الأهل والولد": [
        "أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لاَمَّةٍ.",
        "اللَّهُمَّ احْفَظْهُمْ بِحِفْظِكَ وَاكْلَأْهُمْ بِرِعَايَتِكَ.",
        "اللَّهُمَّ بَارِكْ لِي فِي أَوْلاَدِي وَلاَ تَضُرَّهُمْ وَوَفِّقْهُمْ لِطَاعَتِكَ.",
        "اللَّهُمَّ اجْعَلْهُمْ هُدَاةً مُهْتَدِينَ غَيْرَ ضَالِّينَ وَلاَ مُضِلِّينَ."
    ],
    "دعاء صلاة الحاجة": [
        "لاَ إِلَهَ إِلاَّ اللَّهُ الْحَلِيمُ الْكَرِيمُ، سُبْحَانَ اللَّهِ رَبِّ الْعَرْشِ الْعَظِيمِ.",
        "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، أَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ وَعَزَائِمَ مَغْفِرَتِكَ.",
        "وَالْغَنِيمَةَ مِنْ كُلِّ بِرٍّ وَالسَّلاَمَةَ مِنْ كُلِّ إِثْمٍ.",
        "لاَ تَدَعْ لِي ذَنْباً إِلاَّ غَفَرْتَهُ وَلاَ هَمّاً إِلاَّ فَرَّجْتَهُ وَلاَ حَاجَةً هِيَ لَكَ رِضاً إِلاَّ قَضَيْتَهَا يَا أَرْحَمَ الرَّاحِمِينَ."
    ],
    "دعاء القنوت في الوتر": [
        "اللَّهُمَّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلَّنِي فِيمَنْ تَوَلَّيْتَ.",
        "وَبَارِكْ لِي فِيمَا أَعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ.",
        "فَإِنَّكَ تَقْضِي وَلاَ يُقْضَى عَلَيْكَ، إِنَّهُ لاَ يَذِلُّ مَنْ وَالَيْتَ وَلاَ يَعِزُّ مَنْ عَادَيْتَ.",
        "تَبَارَكْتَ رَبَّنَا وَتَعَالَيْتَ."
    ],    "دعاء ليلة القدر": [
        "اللَّهُمَّ إِنَّكَ عَفُوٌّ تُحِبُّ الْعَفْوَ فَاعْفُ عَنِّي.",
        "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ.",
        "اللَّهُمَّ أَعِنَّا عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ فِي هَذِهِ اللَّيْلَةِ الْمُبَارَكَةِ.",
        "اللَّهُمَّ إِذَا قَسَمْتَ فِي هَذِهِ اللَّيْلَةِ خَيْراً وَعَافِيَةً فَاجْعَلْ لَنَا مِنْهُ أَعْظَمَ النَّصِيبِ."
    ],
    "دعاء رؤية الكعبة": [
        "اللَّهُمَّ زِدْ هَذَا الْبَيْتَ تَشْرِيفاً وَتَعْظِيماً وَتَكْرِيماً وَمَهَابَةً.",
        "وَزِدْ مَنْ شَرَّفَهُ وَكَرَّمَهُ مِمَّنْ حَجَّهُ أَوِ اعْتَمَرَهُ تَشْرِيفاً وَتَكْرِيماً وَتَعْظِيماً وَبِرّاً.",
        "اللَّهُمَّ أَنْتَ السَّلاَمُ وَمِنْكَ السَّلاَمُ، فَحَيِّنَا رَبَّنَا بِالسَّلاَمِ.",
        "بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ عِنْدَ رُؤْيَتِهَا."
    ],
    "دعاء شرب ماء زمزم": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نَافِعاً، وَرِزْقاً وَاسِعاً، وَشِفَاءً مِنْ كُلِّ دَاءٍ.",
        "مَاءُ زَمْزَمَ لِمَا شُرِبَ لَهُ.",
        "الْحَمْدُ لِلَّهِ الَّذِي جَعَلَهُ طَعَامَ طُعْمٍ وَشِفَاءَ سُقْمٍ.",
        "اللَّهُمَّ اغْسِلْ بِهِ قَلْبِي وَاشْفِ بِهِ بَدَنِي."
    ],
    "دعاء سجدة التلاوة": [
        "سَجَدَ وَجْهِيَ لِلَّذِي خَلَقَهُ وَشَقَّ سَمْعَهُ وَبَصَرَهُ بِحَوْلِهِ وَقُوَّتِهِ، فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ.",
        "اللَّهُمَّ اكْتُبْ لِي بِهَا عِنْدَكَ أَجْراً، وَضَعْ عَنِّي بِهَا وِزْراً.",
        "وَاجْعَلْهَا لِي عِنْدَكَ ذُخْراً، وَتَقَبَّلْهَا مِنِّي كَمَا تَقَبَّلْتَهَا مِنْ عَبْدِكَ دَاوُدَ.",
        "سُبْحَانَ رَبِّنَا إِنْ كَانَ وَعْدُ رَبِّنَا لَمَفْعُولاً."
    ],
    "دعاء العافية والمعافاة": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْمُعَافَاةَ الدَّائِمَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي.",
        "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي.",
        "لاَ إِلَهَ إِلاَّ أَنْتَ، أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ وَتَحَوُّلِ عَافِيَتِكَ."
    ],
    "دعاء الصبر عند المصيبة": [
        "إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ، اللَّهُمَّ أْجُرْنِي فِي مُصِيبَتِي وَأَخْلِفْ لِي خَيْراً مِنْهَا.",
        "الْحَمْدُ لِلَّهِ عَلَى كُلِّ حَالٍ، وَأَعُوذُ بِاللَّهِ مِنْ حَالِ أَهْلِ النَّارِ.",
        "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ.",
        "اللَّهُمَّ ارْزُقْنِي الصَّبْرَ عِنْدَ الصَّدْمَةِ الأُولَى وَاجْعَلْنِي مِنَ الصَّابِرِينَ."
    ],
    "دعاء بر الوالدين": [
        "رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيراً.",
        "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ.",
        "اللَّهُمَّ ارْزُقْنِي بِرَّهُمَا فِي حَيَاتِهِمَا وَبَعْدَ مَمَاتِهِمَا.",
        "اللَّهُمَّ اجْعَلْ أُمِّي وَأَبِي مِنْ سَادَةِ أَهْلِ الْجَنَّةِ."
    ],
    "دعاء صلاح الذرية": [
        "رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ.",
        "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَاماً.",
        "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلاَةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ.",
        "اللَّهُمَّ صَلِّحْ لِي فِي ذُرِّيَّتِي إِنِّي تُبْتُ إِلَيْكَ وَإِنِّي مِنَ الْمُسْلِمِينَ."
    ],    "دعاء حسن الخاتمة": [
        "اللَّهُمَّ اجْعَلْ خَيْرَ أَعْمَارِنَا آخِرَهَا، وَخَيْرَ أَعْمَالِنَا خَوَاتِيمَهَا، وَخَيْرَ أَيَّامِنَا يَوْمَ نَلْقَاكَ.",
        "اللَّهُمَّ تَوَفَّنَا مُسْلِمِينَ وَأَحْيِنَا مُسْلِمِينَ وَأَلْحِقْنَا بِالصَّالِحِينَ غَيْرَ خَزَايَا وَلاَ مَفْتُونِينَ.",
        "اللَّهُمَّ ارْزُقْنَا شَهَادَةً فِي سَبِيلِكَ وَمَوْتاً فِي بَلَدِ رَسُولِكَ.",
        "اللَّهُمَّ احْسِنْ عَاقِبَتَنَا فِي الأُمُورِ كُلِّهَا وَأَجِرْنَا مِنْ خِزْيِ الدُّنْيَا وَعَذَابِ الآخِرَةِ."
    ],
    "دعاء دخول المقبرة والدعاء للموتى": [
        "السَّلاَمُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَلاَحِقُونَ.",
        "اللَّهُمَّ اغْفِرْ لَهُمْ وَارْحَمْهُمْ وَعَافِهِمْ وَاعْفُ عَنْهُمْ وَأَكْرِمْ نُزُلَهُمْ.",
        "اللَّهُمَّ وَسِّعْ مُدْخَلَهُمْ وَاغْسِلْهُمْ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ.",
        "اللَّهُمَّ أَبْدِلْهُمْ دَاراً خَيْراً مِنْ دَارِهِمْ وَأَهْلاً خَيْراً مِنْ أَهْلِهِمْ."
    ],
    "دعاء صلاة الاستسقاء طلب المطر": [
        "اللَّهُمَّ اسْقِنَا غَيْثاً مُغِيثاً مَرِيئاً مَرِيعاً نَافِعاً غَيْرَ ضَارٍّ.",
        "اللَّهُمَّ أَنْبِتْ لَنَا الزَّرْعَ وَأَدِرَّ لَنَا الضَّرْعَ وَاسْقِنَا مِنْ بَرَكَاتِ السَّمَاءِ.",
        "اللَّهُمَّ إِنَّا نَسْتَغْفِرُكَ إِنَّكَ كُنْتَ غَفَّاراً فَأَرْسِلِ السَّمَاءَ عَلَيْنَا مِدْرَاراً.",
        "اللَّهُمَّ اسْقِ عِبَادَكَ وَبَهَائِمَكَ وَانْشُرْ رَحْمَتَكَ وَأَحْيِ بَلَدَكَ الْمَيِّتَ."
    ],
    "دعاء الثبات على الدين": [
        "يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ.",
        "يَا مُصَرِّفَ الْقُلُوبِ صَرِّفْ قُلُوبَنَا عَلَى طَاعَتِكَ.",
        "رَبَّنَا لاَ تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ إِيمَاناً لاَ يَرْتَدُّ وَنَعِيماً لاَ يَنْفَدُ."
    ],
    "دعاء تفريغ الطاقة السلبية والهموم": [
        "اللَّهُمَّ اجْعَلْ لِي مِنْ كُلِّ هَمٍّ وَضِيقٍ مَخْرَجاً وَمِنْ كُلِّ بَلاَءٍ عَافِيَةً.",
        "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي.",
        "لاَ إِلَهَ إِلاَّ أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ.",
        "اللَّهُمَّ اطْرُدْ عَنِّي وَسَاوِسَ الشَّيْطَانِ وَاقْذِفْ فِي قَلْبِي السَّكِينَةَ وَالأَمَانَ."
    ],
    "دعاء تيسير الأمور الصعبة": [
        "اللَّهُمَّ لاَ سَهْلَ إِلاَّ مَا جَعَلْتَهُ سَهْلاً وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلاً.",
        "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ أَصْلِحْ لِي شَأْنِي كُلَّهُ.",
        "رَبِّ يَسِّرْ وَلاَ تُعَسِّرْ وَتَمِّمْ بِالْخَيْرِ.",
        "اللَّهُمَّ أَلْهِمْنِي الرُّشْدَ فِي أَمْرِي وَاهْدِنِي لأَقْرَبَ مِنْ هَذَا رَشَداً."
    ],
    "دعاء الوقاية من العين والحسد": [
        "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ وَمِنْ كُلِّ عَيْنٍ لاَمَّةٍ.",
        "بِسْمِ اللَّهِ الَّذِي لاَ يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الأَرْضِ وَلاَ فِي السَّمَاءِ.",
        "اللَّهُمَّ أَبْطِلْ أَثَرَ كُلِّ عَيْنٍ حَاسِدَةٍ أَوْ خَبِيثَةٍ أُصِيبَ بِهَا جَسَدِي أَوْ مَالِي.",
        "قُلْ هُوَ اللَّهُ أَحَدٌ وَالْمُعَوِّذَتَانِ حِصْنٌ حَصِينٌ مِنْ كُلِّ حَاسِدٍ."
    ],
    "دعاء هداية النفس والصلاح": [
        "اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا أَنْتَ وَلِيُّهَا وَمَوْلاَهَا.",
        "اللَّهُمَّ اهْدِنِي لاَحْسَنِ الأَخْلاَقِ لاَ يَهْدِي لأَحْسَنِهَا إِلاَّ أَنْتَ.",
        "وَاصْرِفْ عَنِّي سَيِّئَهَا لاَ يَصْرِفُ عَنِّي سَيِّئَهَا إِلاَّ أَنْتَ.",
        "اللَّهُمَّ اجْعَلْنِي هَادِياً مُهْتَدِياً غَيْرَ ضَالٍّ وَلاَ مُضِلٍّ."
    ],    "دعاء طلب العلم والترقية": [
        "رَبِّ زِدْنِي عِلْماً وَارْزُقْنِي فَهْماً.",
        "اللَّهُمَّ انْفَعْنِي بِمَا عَلَّمْتَنِي وَعَلِّمْنِي مَا يَنْفَعُنِي وَزِدْنِي عِلْماً.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْماً نَافِعاً وَرِزْقاً طَيِّباً وَعَمَلاً مُتَقَبَّلاً.",
        "اللَّهُمَّ فَقِّهْنِي فِي الدِّينِ وَعَلِّمْنِي التَّأْوِيلَ."
    ],
    "دعاء قضاء الدين وتيسير الرزق": [
        "اللَّهُمَّ اكْفِنِي بِحَلاَلِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ.",
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ وَالْبُخْلِ وَالْجُبْنِ وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ.",
        "اللَّهُمَّ مالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ الْمُلْكَ مِمَّنْ تَشَاءُ.",
        "رَحْمَنَ الدُّنْيَا وَالآخِرَةِ وَرَحِيمَهُمَا ارْحَمْنِي رَحْمَةً تُغْنِينِي بِهَا عَنْ رَحْمَةِ مَنْ سِوَاكَ."
    ],
    "دعاء حفظ الجوارح واللسان": [
        "اللَّهُمَّ إِني أَعُوذُ بِكَ مِنْ شَرِّ سَمْعِي وَمِنْ شَرِّ بَصَرِي وَمِنْ شَرِّ لِسَانِي.",
        "وَمِنْ شَرِّ قَلْبِي وَمِنْ شَرِّ مَنِيِّي.",
        "اللَّهُمَّ اجْعَلْ صَمْتِي فِكْراً وَنُطْقِي ذِكْراً وَنَظَرِي عِبْرَةً.",
        "رَبِّ أَعِنِّي عَلَى حِفْظِ لِسَانِي وَجَوَارِحِي عَمَّا يُغْضِبُكَ."
    ],
    "دعاء المحبة والألفة بين المسلمين": [
        "اللَّهُمَّ أَلِّفْ بَيْنَ قُلُوبِنَا وَأَصْلِحْ ذَاتَ بَيْنِنَا وَاهْدِنَا سُبُلَ السَّلاَمِ.",
        "وَنَجِّنَا مِنَ الظُّلُمَاتِ إِلَى النُّورِ وَجَنِّبْنَا الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ.",
        "وَ بَارِكْ لَنَا فِي أَسْمَاعِنَا وَأَبْصَارِنَا وَقُلُوبِنَا وَأَزْوَاجِنَا وَذُرِّيَّاتِنَا.",
        "اللَّهُمَّ اجْعَلْنَا مُتَحَابِّينَ فِي جَلاَلِكَ مُجْتَمِعِينَ عَلَى طَاعَتِكَ."
    ],
    "دعاء رد الضالة والمفقود": [
        "اللَّهُمَّ رَادَّ الضَّالَّةِ وَهَادِيَ الضَّالَّةِ أَنْتَ تَهْدِي مِنَ الضَّلاَلَةِ.",
        "ارْدُدْ عَلَيَّ ضَالَّتِي بِقُدْرَتِكَ وَسُلْطَانِكَ فَإِنَّهَا مِنْ عَطَائِكَ وَفَضْلِكَ.",
        "يَا جَامِعَ النَّاسِ لِيَوْمٍ لاَ رَيْبَ فِيهِ إِجْمَعْ بَيْنِي وَبَيْنَ ضَالَّتِي.",
        "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ فِي كُلِّ مَا فَقَدْنَاهُ."
    ],
    "دعاء دخول السوق والتجارة": [
        "لاَ إِلَهَ إِلاَّ اللَّهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ يُحْيِي وَيُمِيتُ وَهُوَ حَيٌّ لاَ يَمُوتُ.",
        "بِيَدِهِ الْخَيْرُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",
        "كَتَبَ اللَّهُ لَهُ أَلْفَ أَلْفِ حَسَنَةٍ وَمَحَا عَنْهُ أَلْفَ أَلْفِ سَيِّئَةٍ.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ هَذِهِ السُّوقِ وَخَيْرَ مَا فِيهَا وَأَعُوذُ بِكَ مِنْ شَرِّهَا وَشَرِّ مَا فِيهَا."
    ],
    "دعاء الاستعاذة من الفتن": [
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْفِتَنِ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ.",
        "اللَّهُمَّ إِذَا أَرَدْتَ بِعِبَادِكَ فِتْنَةً فَاقْبِضْنِي إِلَيْكَ غَيْرَ مَفْتُونٍ.",
        "اللَّهُمَّ أَعِذْنَا مِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ وَمِنْ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ.",
        "رَبَّنَا لاَ تَجْعَلْنَا فِتْنَةً لِلْقَوْمِ الظَّالِمِينَ وَنَجِّنَا بِرَحْمَتِكَ."
    ],
    "دعاء التوكل والتفويض": [
        "تَوَكَّلْتُ عَلَى الْحَيِّ الَّذِي لاَ يَمُوتُ، وَالْحَمْدُ لِلَّهِ الَّذِي لَمْ يَتَّخِذْ وَلَداً.",
        "فَوَّضْتُ أَمْرِي إِلَى اللَّهِ إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ.",
        "حَسْبِيَ اللَّهُ لاَ إِلَهَ إِلاَّ هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.",
        "بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ."
    ],    "دعاء الشكر والثناء على الله": [
        "الْحَمْدُ لِلَّهِ كَثِيراً طَيِّباً مُبَارَكاً فِيهِ كَمَا يُحِبُّ رَبُّنَا وَيَرْضَى.",
        "اللَّهُمَّ لَكَ الْحَمْدُ حَتَّى تَرْضَى، وَلَكَ الْحَمْدُ إِذَا رَضِيتَ، وَلَكَ الْحَمْدُ بَعْدَ الرِّضَا.",
        "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",
        "اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ."
    ],
    "دعاء طلب الرحمة والمغفرة": [
        "رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ.",
        "رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ.",
        "اللَّهُمَّ إِنَّ رَحْمَتَكَ أَوْسَعُ مِنْ ذُنُوبِي وَرَجَائِي أَوْسَعُ مِنْ عَمَلِي.",
        "اللَّهُمَّ اغْفِرْ لِي ذَنْبِي كُلَّهُ دِقَّهُ وَجِلَّهُ وَأَوَّلَهُ وَآخِرَهُ وَعَلاَنِيَتَهُ وَسِرَّهُ."
    ],
    "دعاء الوقاية من شرور الخَلق": [
        "اللَّهُمَّ إِنَّا نَجْعَلُكَ فِي نُحُورِهِمْ وَنَعُوذُ بِكَ مِنْ شُرُورِهِمْ.",
        "اللَّهُمَّ اكْفِنِيهِمْ بِمَا شِئْتَ وَكَيْفَ شِئْتَ إِنَّكَ عَلَى مَا تَشَاءُ قَدِيرٌ.",
        "حَسْبِيَ اللَّهُ لِدِينِي، حَسْبِيَ اللَّهُ لِدُنْيَايَ، حَسْبِيَ اللَّهُ لِمَا أَهَمَّنِي.",
        "اللَّهُمَّ احْرُسْنِي بِعَيْنِكَ الَّتِي لاَ تَنَامُ وَاكْنُفْنِي بِرُكْنِكَ الَّذِي لاَ يُرَامُ."
    ],
    "دعاء طلب الفردوس الأعلى": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَأَعُوذُ بِكَ مِنَ النَّارِ (ثَلاَثاً).",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْفِرْدَوْسَ الأَعْلَى مِنَ الْجَنَّةِ بِغَيْرِ حِسَابٍ وَلاَ سَابِقَةِ عَذَابٍ.",
        "اللَّهُمَّ اجْعَلْنَا مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ.",
        "اللَّهُمَّ أَدْخِلْنَا الْجَنَّةَ مَعَ الأَبْرَارِ يَا عَزِيزُ يَا غَفَّارُ."
    ],
    "دعاء النجاة من عذاب القبر": [
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَمِنْ عَذَابِ جَهَنَّمَ.",
        "اللَّهُمَّ نَوِّرْ لِي فِي قَبْرِي وَوَسِّعْ لِي فِيهِ.",
        "اللَّهُمَّ اجْعَلْ قَبْرِي رَوْضَةً مِنْ رِيَاضِ الْجَنَّةِ وَلاَ تَجْعَلْهُ حُفْرَةً مِنْ حُفَرِ النِّيرَانِ.",
        "اللَّهُمَّ ثَبِّتْنِي عِنْدَ السُّؤَالِ فِي الْقَبْرِ."
    ],
    "دعاء صلاح القلب والطهارة": [
        "اللَّهُمَّ نَقِّ قَلْبِي مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الأَبْيَضُ مِنَ الدَّنَسِ.",
        "اللَّهُمَّ طَهِّرْ قَلْبِي مِنَ النِّفَاقِ وَعَمَلِي مِنَ الرِّيَاءِ وَلِسَانِي مِنَ الْكَذِبِ.",
        "اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُوراً وَفِي بَصَرِي نُوراً وَفِي سَمْعِي نُوراً.",
        "اللَّهُمَّ طَهِّرْنِي بِالثَّلْجِ وَالْبَرَدِ وَالْمَاءِ الْبَارِدِ."
    ],
    "دعاء دفع الكرب والشدائد": [
        "لاَ إِلَهَ إِلاَّ اللَّهُ الْعَظِيمُ الْحَلِيمُ، لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ.",
        "لاَ إِلَهَ إِلاَّ اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ.",
        "اللَّهُمَّ أَقِلْ عَثَرَاتِنَا وَارْفَعْ كُرُبَاتِنَا وَاشْفِ مَرْضَانَا وَارْحَمْ مَوْتَانَا.",
        "يَا كَاشِفَ الْهَمِّ وَيَا فَارِجَ الْغَمِّ فَرِّجْ عَنِّي مَا أَهَمَّنِي."
    ],
    "دعاء الخروج للدراسة أو العمل": [
        "بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ.",
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ أَنْ أَضِلَّ أَوْ أُضَلَّ، أَوْ أَزِلَّ أَوْ أُزَلَّ، أَوْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَجْهَلَ أَوْ يُجْهَلَ عَلَيَّ.",
        "اللَّهُمَّ اجْعَلْ يَوْمِي هَذَا خَيْراً وَبَرَكَةً وَتَوْفِيقاً.",
        "اللَّهُمَّ ارْزُقْنِي فِيهِ السَّدَادَ وَالنَّجَاحَ فِي كُلِّ عَمَلٍ وَسَعْيٍ."
    ],    "دعاء طلب التوفيق والسداد": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ التَّوْفِيقَ فِي الأُمُورِ كُلِّهَا وَالسَّدَادَ فِي القَوْلِ وَالعَمَلِ.",
        "رَبِّ وَفِّقْنِي لِمَا تُحِبُّ وَتَرْضَى وَأَعِنِّي عَلَى طَاعَتِكَ.",
        "اللَّهُمَّ اهْدِنِي وَسَدِّدْنِي وَاذْكُرْ بِالهُدَى هِدَايَتَكَ الطَّرِيقَ.",
        "اللَّهُمَّ لاَ تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ وَأَصْلِحْ لِي شَأْنِي كُلَّهُ."
    ],
    "دعاء الشكر على نعمة الصحة والعافية": [
        "الْحَمْدُ لِلَّهِ الَّذِي عَافَانِي فِي جَسَدِي وَرَدَّ عَلَيَّ رُوحِي وَأَذِنَ لِي بِذِكْرِهِ.",
        "اللَّهُمَّ أَدِمْ عَلَيْنَا نِعْمَةَ الصِّحَّةِ وَالعَافِيَةِ وَاحْفَظْهَا مِنَ الزَّوَالِ.",
        "اللَّهُمَّ أَمْتِعْنَا بِأَسْمَاعِنَا وَأَبْصَارِنَا وَقُوَّاتِنَا مَا أَحْيَيْتَنَا.",
        "الْحَمْدُ لِلَّهِ حَمْداً كَثِيراً عَلَى العَافِيَةِ فِي البَدَنِ وَالأَهْلِ وَالمَالِ."
    ],
    "دعاء صلاة الحاجة والتيسير": [
        "لاَ إِلَهَ إِلاَّ اللَّهُ الحَلِيمُ الكَرِيمُ سُبْحَانَ اللَّهِ رَبِّ العَرْشِ العَظِيمِ.",
        "الْحَمْدُ لِلَّهِ رَبِّ العَالَمِينَ أَسْأَلُكَ مُوجِبَاتِ رَحْمَتِكَ وَعَزَائِمَ مَغْفِرَتِكَ.",
        "وَالغَنِيمَةَ مِنْ كُلِّ بِرٍّ وَالسَّلاَمَةَ مِنْ كُلِّ إِثْمٍ.",
        "لاَ تَدَعْ لِي ذَنْباً إِلاَّ غَفَرْتَهُ وَلاَ هَمّاً إِلاَّ فَرَّجْتَهُ وَلاَ حَاجَةً هِيَ لَكَ رِضاً إِلاَّ قَضَيْتَهَا."
    ],
    "دعاء الحفظ من شرور النفس والشيطان": [
        "اللَّهُمَّ أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ.",
        "وَأَنْ أَقْتَرِفَ عَلَى نَفْسِي سُوءاً أَوْ أَجُرَّهُ إِلَى مُسْلِمٍ.",
        "اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي.",
        "وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي."
    ],
    "دعاء طلب البركة في العمر والوقت": [
        "اللَّهُمَّ بَارِكْ لِي فِي عُمُرِي وَأَوْقَاتِي وَاجْعَلْهَا فِي طَاعَتِكَ.",
        "اللَّهُمَّ اجْعَلْ حَيَاتِي زِيَادَةً لِي فِي كُلِّ خَيْرٍ وَمَوْتِي رَاحَةً لِي مِنْ كُلِّ شَرٍّ.",
        "اللَّهُمَّ بَارِكْ لِي فِي ثَمَرَةِ جُهْدِي وَعَمَلِي.",
        "اللَّهُمَّ ارْزُقْنِي البَرَكَةَ فِي القَوْلِ وَالعَمَلِ وَالوَقْتِ."
    ],
    "دعاء طلب القناعة وراحة البال": [
        "اللَّهُمَّ قَنِّعْنِي بِمَا رَزَقْتَنِي وَبَارِكْ لِي فِيهِ وَاخْلُفْ عَلَى كُلِّ غَائِبَةٍ لِي بِخَيْرٍ.",
        "اللَّهُمَّ اجْعَلْ القَنَاعَةَ فِي قَلْبِي وَالرِّضَا فِي نَفْسِي.",
        "اللَّهُمَّ ارْزُقْنِي قَلْباً شَاكِراً وَلِسَاناً ذَاكِراً وَبَدَناً عَلَى البَلاَءِ صَابِراً.",
        "اللَّهُمَّ أَرِحْ فِكْرِي وَقَلْبِي وَاكْفِنِي مَا أَهَمَّنِي."
    ],
    "دعاء الثبات في الأمر والعزيمة": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الأَمْرِ وَالعَزِيمَةَ عَلَى الرُّشْدِ.",
        "وَأَسْأَلُكَ شُكْرَ نِعْمَتِكَ وَحُسْنَ عِبَادَتِكَ.",
        "وَأَسْأَلُكَ قَلْباً سَلِيماً وَلِسَاناً صَادِقاً.",
        "وَأَسْأَلُكَ مِنْ خَيْرِ مَا تَعْلَمُ وَأَعُوذُ بِكَ مِنْ شَرِّ مَا تَعْلَمُ."
    ],
    "دعاء طلب حسن الخلق والتعامل": [
        "اللَّهُمَّ كَمَا حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي.",
        "اللَّهُمَّ اهْدِنِي لأَحْسَنِ الأَخْلاَقِ لاَ يَهْدِي لأَحْسَنِهَا إِلاَّ أَنْتَ.",
        "اللَّهُمَّ جَنِّبْنِي مُنْكَرَاتِ الأَخْلاَقِ وَالأَهْوَاءِ وَالأَعْمَالِ وَالأَدْوَاءِ.",
        "اللَّهُمَّ اجْعَلْنِي هَيِّناً لَيِّناً سَهْلاً قَرِيباً مِنَ النَّاسِ."
    ],    "دعاء طلب الرحمة والمغفرة للوالدين": [
        "رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيراً.",
        "اللَّهُمَّ اغْفِرْ لَهُمَا وَارْحَمْهُمَا وَعَافِهِمَا وَاعْفُ عَنْهُمَا.",
        "اللَّهُمَّ اجْزِهِمَا عَنِّي خَيْرَ الْجَزَاءِ وَأَعْظَمَهُ وَأَكْمَلَهُ.",
        "اللَّهُمَّ ارْفَعْ دَرَجَاتِهِمَا فِي الْمَهْدِيِّينَ وَاخْلُفْهُمَا فِي عَقِبِهِمَا فِي الْغَابِرِينَ."
    ],
    "دعاء طلب القوة والإعانة على الطاعة": [
        "اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ.",
        "اللَّهُمَّ قَوِّ فِي طَاعَتِكَ بَدَنِي وَاشْرَحْ لِلْخَيْرِ صَدْرِي.",
        "اللَّهُمَّ لاَ تَكِلْنِي إِلَى حَوْلِي وَقُوَّتِي فَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِكَ.",
        "رَبِّ أَعِنِّي وَلاَ تُعِنْ عَلَيَّ وَانْصُرْنِي وَلاَ تَنْصُرْ عَلَيَّ."
    ],
    "دعاء طلب نور البصيرة والحكمة": [
        "اللَّهُمَّ آتِنِي الْحِكْمَةَ الَّتِي مَنْ أُوتِيَهَا فَقَدْ أُوتِيَ خَيْراً كَثِيراً.",
        "اللَّهُمَّ أَنِرْ بَصِيرَتِي وَاهْدِ قَلْبِي لِلسَّدَادِ.",
        "اللَّهُمَّ ارْزُقْنِي الْفَهْمَ وَالنُّورَ وَالْحِكْمَةَ فِي الْقَوْلِ وَالْعَمَلِ.",
        "اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُوراً وَفِي بَصَرِي نُوراً وَفِي بَصِيرَتِي نُوراً."
    ],
    "دعاء الاستعاذة من خزي الدنيا وعذاب الآخرة": [
        "اللَّهُمَّ أَحْسِنْ عَاقِبَتَنَا فِي الأُمُورِ كُلِّهَا وَأَجِرْنَا مِنْ خِزْيِ الدُّنْيَا وَعَذَابِ الآخِرَةِ.",
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْفَضِيحَةِ وَالْخِزْيِ فِي الدُّنْيَا وَالآخِرَةِ.",
        "اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي وَاحْفَظْنِي مِنْ كُلِّ سُوءٍ.",
        "اللَّهُمَّ لاَ تُخْزِنِي يَوْمَ يُبْعَثُونَ يَوْمَ لاَ يَنْفَعُ مَالٌ وَلاَ بَنُونَ."
    ],
    "دعاء سلامة الصدر ومغفرة الأحقاد": [
        "رَبَّنَا اغْفِرْ لَنَا وَلإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالإِيمَانِ.",
        "وَلاَ تَجْعَلْ فِي قُلُوبِنَا غِلاًّ لِلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَؤُوفٌ رَحِيمٌ.",
        "اللَّهُمَّ انْزِعْ مَا فِي قُلُوبِنَا مِنْ غِلٍّ أَوْ حَسَدٍ أَوْ حِقْدٍ.",
        "اللَّهُمَّ اجْعَلْ قُلُوبَنَا سَلِيمَةً نَقِيَّةً طَاهِرَةً مُتَحَابَّةً فِي جَلاَلِكَ."
    ],
    "دعاء طلب الغنى والتعفف": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى.",
        "اللَّهُمَّ اغْنِنِي بِالْعِلْمِ وَزَيِّنِّي بِالْحِلْمِ وَأَكْرِمْنِي بِالتَّقْوَى.",
        "اللَّهُمَّ اكْفِنِي بِحَلاَلِكَ عَنْ حَرَامِكَ وَأَغْنِنِي بِفَضْلِكَ عَمَّنْ سِوَاكَ.",
        "اللَّهُمَّ ارْزُقْنِي نَفْساً قَانِعَةً وَعِفَّةً فِي الظَّاهِرِ وَالْبَاطِنِ."
    ],
    "دعاء طلب الاستقامة واليقين": [
        "اللَّهُمَّ اهْدِنِي الصِّرَاطَ الْمُسْتَقِيمَ وَثَبِّتْنِي عَلَيْهِ.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ يَقِيناً صَادِقاً حَتَّى أَعْلَمَ أَنَّهُ لاَ يُصِيبُنِي إِلاَّ مَا كَتَبْتَ لِي.",
        "رَبِّ اجْعَلْنِي مِنَ الْمُسْتَقِيمِينَ عَلَى أَمْرِكَ فِي السَّرَّاءِ وَالضَّرَّاءِ.",
        "اللَّهُمَّ ارْزُقْنِي حُسْنَ الظَّنِّ بِكَ وَقُوَّةَ الْيَقِينِ بِمَوْعُودِكَ."
    ],
    "دعاء الشكر عند تجدد النعم": [
        "الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ.",
        "اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ.",
        "فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ عَلَى نِعَمِكَ الظَّاهِرَةِ وَالْبَاطِنَةِ.",
        "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ."
    ],    "دعاء الشكر عند تجدد النعم": [
        "الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ.",
        "اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ.",
        "فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ عَلَى نِعَمِكَ الظَّاهِرَةِ وَالْبَاطِنَةِ.",
        "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ."
    ],
    "دعاء طلب النصرة والتمكين": [
        "اللَّهُمَّ انْصُرْنَا وَلاَ تَنْصُرْ عَلَيْنَا، وَامْكُرْ لَنَا وَلاَ تَمْكُرْ عَلَيْنَا.",
        "وَاهْدِنَا وَيَسِّرِ الْهُدَى لَنَا، وَانْصُرْنَا عَلَى مَنْ بَغَى عَلَيْنَا.",
        "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْراً وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ.",
        "اللَّهُمَّ أَنْتَ عَضُدِي وَأَنْتَ نَصِيرِي، بِكَ أَجُولُ وَبِكَ أَصُولُ وَبِكَ أُقَاتِلُ."
    ],
    "دعاء الالتجاء عند الشدائد والأزمات": [
        "اللَّهُمَّ إِلَيْكَ أَشْكُوَ ضُعْفَ قُوَّتِي وَقِلَّةَ حِيلَتِي وَهَوَانِي عَلَى النَّاسِ.",
        "يَا أَرْحَمَ الرَّاحِمِينَ أَنْتَ رَبُّ الْمُسْتَضْعَفِينَ وَأَنْتَ رَبِّي.",
        "إِنْ لَمْ يَكُنْ بِكَ غَضَبٌ عَلَيَّ فَلاَ أُبَالِي وَلَكِنَّ عَافِيَتَكَ هِيَ أَوْسَعُ لِي.",
        "أَعُوذُ بِنُورِ وَجْهِكَ الَّذِي أَشْرَقَتْ لَهُ الظُّلُمَاتُ وَصَلُحَ عَلَيْهِ أَمْرُ الدُّنْيَا وَالآخِرَةِ."
    ],
    "دعاء طلب النجاة يوم القيامة": [
        "اللَّهُمَّ حَاسِبْنِي حِسَاباً يَسِيراً.",
        "اللَّهُمَّ أَعْطِنِي كِتَابِي بِيَمِينِي وَلاَ تُؤْتِنِي كِتَابِي بِشِمَالِي وَلاَ مِنْ وَرَاءِ ظَهْرِي.",
        "اللَّهُمَّ ثَبِّتْ قَدَمَيَّ عَلَى الصِّرَاطِ يَوْمَ تَزِلُّ الأَقْدَامُ.",
        "اللَّهُمَّ اظِلَّنِي تَحْتَ ظِلِّ عَرْشِكَ يَوْمَ لاَ ظِلَّ إِلاَّ ظِلُّكَ."
    ],
    "دعاء سلامة الأهل والدار": [
        "اللَّهُمَّ إِني أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ فِي أَهْلِي وَمَالِي وَدَارِي.",
        "اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي وَاحْفَظْ أَهْلِي مِنْ كُلِّ سُوءٍ.",
        "اللَّهُمَّ اجْعَلْ هَذَا الْبَيْتَ آمِناً مُطْمَئِنّاً وسَائِرَ بُيُوتِ الْمُسْلِمِينَ.",
        "بِسْمِ اللَّهِ عَلَى نَفْسِي وَأَهْلِي وَمَالِي حَصَّنْتُهُمْ بِالْحَيِّ الْقَيُّومِ."
    ],
    "دعاء التوكل والتفويض في القرارات": [
        "اللَّهُمَّ خِرْ لِي وَاخْتَارْ لِي وَلاَ تَكِلْنِي إِلَى خِيَرَتِي لِنَفْسِي.",
        "اللَّهُمَّ اهْدِنِي لِأَرْشَدِ أَمْرِي وَأَعِذْنِي مِنْ شَرِّ نَفْسِي.",
        "رَبِّ إِنِّي لِمَا أَنْزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ.",
        "فَوَّضْتُ أَمْرِي إِلَى اللَّهِ، إِنَّ اللَّهَ بَصِيرٌ بِالْعِبَادِ."
    ],
    "دعاء طلب الخشوع في الصلاة": [
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ قَلْبٍ لاَ يَخْشَعُ، وَمِنْ دُعَاءِ لاَ يُسْمَعُ.",
        "اللَّهُمَّ اجْعَلْ قُرَّةَ عَيْنِي فِي الصَّلاَةِ وَارْزُقْنِي فِيهَا الْحُضُورَ وَالْخُشُوعَ.",
        "اللَّهُمَّ طَهِّرْ عَقْلِي مِنْ وَسَاوِسِ الشَّيْطَانِ فِي صَلاَتِي.",
        "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلاَةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ."
    ],
    "دعاء طلب حُسن العبادة والأثر": [
        "اللَّهُمَّ اجْعَلْنِي مِنَ الَّذِينَ إِذَا أَحْسَنُوا اسْتَبْشَرُوا وَإِذَا أَسَاءُوا اسْتَغْفَرُوا.",
        "اللَّهُمَّ اجْعَلْنِي مُبَارَكاً أَيْنَمَا كُنْتُ وَوَفِّقْنِي لِكُلِّ خَيْرٍ.",
        "اللَّهُمَّ اسْتَعْمِلْنِي فِي طَاعَتِكَ وَلاَ تَسْتَبْدِلْنِي.",
        "اللَّهُمَّ اجْعَلْ أَثَرِي حَسَناً فِي الدُّنْيَا وَذِكْرِي مَحْمُوداً بَعْدَ المَمَاتِ."
    ],    "دعاء الشكر عند تجدد النعم": [
        "الْحَمْدُ لِلَّهِ الَّذِي بِنِعْمَتِهِ تَتِمُّ الصَّالِحَاتُ.",
        "اللَّهُمَّ مَا أَمْسَى بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لاَ شَرِيكَ لَكَ.",
        "فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ عَلَى نِعَمِكَ الظَّاهِرَةِ وَالْبَاطِنَةِ.",
        "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ."
    ],
    "دعاء طلب العزيمة والثبات على الحق": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الأَمْرِ، وَالْعَزِيمَةَ عَلَى الرُّشْدِ.",
        "اللَّهُمَّ حَبَّبْ إِلَيْنَا الإِيمَانَ وَزَيِّنْهُ فِي قُلُوبِنَا، وَكَرِّهْ إِلَيْنَا الْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَ.",
        "وَاجْعَلْنَا مِنَ الرَّاشِدِينَ، اللَّهُمَّ تَوَفَّنَا مُسْلِمِينَ وَأَحْيِنَا مُسْلِمِينَ.",
        "اللَّهُمَّ أَلْحِقْنَا بِالصَّالِحِينَ غَيْرَ خَزَايَا وَلاَ مَفْتُونِينَ."
    ],
    "دعاء طلب حفظ اللسان والجوارح": [
        "اللَّهُمَّ اكْفِنِي شَرَّ لِسَانِي، وَاشْرَحْ لِلْخَيْرِ صَدْرِي.",
        "اللَّهُمَّ اجْعَلْ جَوَارِحِي سَاعِيَةً فِي طَاعَتِكَ، وَاحْفَظْ سَمْعِي وَبَصَرِي عَنْ حَرَامِكَ.",
        "اللَّهُمَّ لاَ تَجْعَلْنِي أَقُولُ زُوراً، أَوْ أَغْشَى فُجُوراً، أَوْ أَكُونُ بِكَ مَغْرُوراً.",
        "رَبِّ أَعِنِّي عَلَى ضَبْطِ نَفْسِي وَالتَّرَفُّعِ عَنِ اللَّغْوِ وَالْبَاطِلِ."
    ],
    "دعاء طلب طهارة القلب من الغل": [
        "رَبَّنَا اغْفِرْ لَنَا وَلإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالإِيمَانِ.",
        "وَلاَ تَجْعَلْ فِي قُلُوبِنَا غِلاًّ لِلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَؤُوفٌ رَحِيمٌ.",
        "اللَّهُمَّ انْزِعْ مِنْ قَلْبِي كُلَّ حَسَدٍ وَكِبْرٍ وَأَذًى لِعِبَادِكَ.",
        "اللَّهُمَّ اجْعَلْ قَلْبِي سَلِيماً، خَالِصاً لِوَجْهِكَ الْكَرِيمِ."
    ],
    "دعاء الوقاية من نزغات الشيطان": [
        "وَقُلْ رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ، وَأَعُوذُ بِكَ رَبِّ أَنْ يَحْضُرُونِ.",
        "اللَّهُمَّ أَجِرْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ، وَمِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ.",
        "اللَّهُمَّ اجْعَلْ بَيْنِي وَبَيْنَ الشَّيْطَانِ سِتْراً حَصِيناً لاَ يَنْفُذُ مِنْهُ.",
        "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ الَّتِي لاَ يُجَاوِزُهُنَّ بَرٌّ وَلاَ فَاجِرٌ مِنْ شَرِّ مَا خَلَقَ."
    ],
    "دعاء طلب ستر العيوب والذنوب": [
        "اللَّهُمَّ اسْتُرْ عَوْرَاتِي، وَآمِنْ رَوْعَاتِي، وَاحْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي.",
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ السَّتْرَ فِي الدُّنْيَا وَالآخِرَةِ، وَلاَ تَفْضَحْنِي بَيْنَ خَلْقِكَ.",
        "اللَّهُمَّ امْحُ حُُوبِي، وَاسْتُرْ عُيُوبِي، وَتَجَاوَزْ عَنْ سَيِّئَاتِي.",
        "اللَّهُمَّ اجْعَلْ حَسَنَاتِي فِي خَفَاءٍ، وَاسْتُرْ سَيِّئَاتِي عَنِ الْعَيْنِ وَالْمَلأِ."
    ],
    "دعاء طلب البركة في الصحة والشباب": [
        "اللَّهُمَّ مَتِّعْنَا بِأَسْمَاعِنَا وَأَبْصَارِنَا وَقُوَّاتِنَا مَا أَحْيَيْتَنَا، وَاجْعَلْهُ الْوَارِثَ مِنَّا.",
        "اللَّهُمَّ اجْعَلْ شَبَابِي فِي طَاعَتِكَ، وَقُوَّتِي فِي خِدْمَةِ دِينِكَ.",
        "اللَّهُمَّ قِنِي شَرَّ الأَسْقَامِ وَالأَوْجَاعِ، وَاحْفَظْ عَلَيَّ بَدَنِي سَلِيماً قَوِيّاً.",
        "الْحَمْدُ لِلَّهِ الَّذِي وَهَبَنِي الصِّحَّةَ وَالْعَافِيَةَ وَالْقُدْرَةَ عَلَى الْعَمَلِ."
    ],
    "دعاء السلامة من الظلم والعدوان": [
        "اللَّهُمَّ إِني أَعُوذُ بِكَ أَنْ أَظْلِمَ أَوْ أُظْلَمَ، أَوْ أَعْتَدِيَ أَوْ يُعْتَدَى عَلَيَّ.",
        "اللَّهُمَّ انْصُرْنِي عَلَى مَنْ ظَلَمَنِي، وَخُذْ لِي بِحَقِّي مِمَّنْ جَارَ عَلَيَّ.",
        "رَبِّ نَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ، وَاجْعَلْ لِي مِنْ لَدُنْكَ وَلِيّاً وَنَصِيراً.",
        "حَسْبِيَ اللَّهُ وَنِعْمَ الْوَكِيلُ فِي كُلِّ مَنْ بَغَى عَلَيَّ أَوْ كَادَنِي بِسُوءٍ."
    ],    "دعاء طلب انشراح الصدر ونور القلب": [
        "رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي.",
        "اللَّهُمَّ اجْعَلْ فِي قَلْبِي نُوراً وَفِي لِسَانِي نُوراً وَفِي سَمْعِي نُوراً وَفِي بَصَرِي نُوراً.",
        "اللَّهُمَّ نَوِّرْ قَلْبِي بِالإِيمَانِ وَاليَقِينِ وَامْلأْ صَدْرِي بِالسَّكِينَةِ وَالاطْمِئْنَانِ.",
        "اللَّهُمَّ اطْرُدْ عَنِّي الهَمَّ وَالحَزَنَ وَأَبْدِلْهُُمَا بَهْجَةً وَسُرُوراً."
    ],
    "دعاء السلامة من فتن الدنيا ومغرياتها": [
        "اللَّهُمَّ لاَ تَجْعَلِ الدُّنْيَا أَكْبَرَ هَمِّنَا وَلاَ مَبْلَغَ عِلْمِنَا وَلاَ إِلَى النَّارِ مَصِيرَنَا.",
        "اللَّهُمَّ زَهِّدْنَا فِي زَخَارِفِ الدُّنْيَا وَارْزُقْنَا الرَّغْبَةَ فِي الآخِرَةِ.",
        "اللَّهُمَّ اعْصِمْنَا مِنَ الشُّبُهَاتِ وَالشَّهَوَاتِ وَاهْدِنَا صِرَاطَكَ المُسْتَقِيمَ.",
        "رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ إِنَّ عَذَابَهَا كَانَ غَرَاماً."
    ],
    "دعاء التوفيق في التعلم والتركيز": [
        "اللَّهُمَّ أَنِرْ عَقْلِي وَزِدْنِي فَهْماً وَحِفْظاً وَتَوْفِيقاً.",
        "اللَّهُمَّ لاَ سَهْلَ إِلاَّ مَا جَعَلْتَهُ سَهْلاً وَأَنْتَ تَجْعَلُ الصَّعْبَ إِنْ شِئْتَ سَهْلاً.",
        "اللَّهُمَّ اجْعَلْ عِلْمِي حُجَّةً لِي لاَ عَلَيَّ وَارْزُقْنِي البَرَكَةَ فِي العَمَلِ بِهِ.",
        "رَبِّ اشْرَحْ لِي صَدْرِي وَأَطْلِقْ لِسَانِي بِالحِكْمَةِ وَالبَيَانِ."
    ],
    "دعاء حفظ النعم والاعتراف بالفضل": [
        "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ زَوَالِ نِعْمَتِكَ وَتَحَوُّلِ عَافِيَتِكَ وَفُجَاءَةِ نِقْمَتِكَ وَجَمِيعِ سَخَطِكَ.",
        "اللَّهُمَّ أَدِمْ عَلَيْنَا نِعَمَكَ الظَّاهِرَةَ وَالبَاطِنَةَ وَلاَ تَحْرِمْنَا بَذُنُوبِنَا.",
        "الْحَمْدُ لِلَّهِ الَّذِي هَدَانَا لِهَذَا وَمَا كُنَّا لِنَهْتَدِيَ لَوْلاَ أَنْ هَدَانَا اللَّهُ.",
        "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ."
    ],
    "دعاء الهداية للحق والصواب": [
        "اللَّهُمَّ أَرِنَا الحَقَّ حَقّاً وَارْزُقْنَا اتِّبَاعَهُ وَأَرِنَا البَاطِلَ بَاطِلاً وَارْزُقْنَا اجْتِنَابَهُ.",
        "اللَّهُمَّ اهْدِنَا فِيمَنْ هَدَيْتَ وَتَوَلَّنَا فِيمَنْ تَوَلَّيْتَ.",
        "اللَّهُمَّ اجْعَلْنَا مِمَّنْ يَسْتَمِعُونَ القَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُ.",
        "رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَداً."
    ],
    "دعاء العفة والطهارة": [
        "اللَّهُمَّ إِنِّي أَسْأَلُكَ الهُدَى وَالتُّقَى وَالعَفَافَ وَالغِنَى.",
        "اللَّهُمَّ حَصِّنْ فَرْجِي وَطَهِّرْ قَلْبِي وَاحْفَظْ جَوَارِحِي عَنِ المَحَارِمِ.",
        "اللَّهُمَّ اغْنِنِي بِحَلاَلِكَ عَنْ حَرَامِكَ وَبِطَاعَتِكَ عَنْ مَعْصِيَتِكَ.",
        "اللَّهُمَّ اجْعَلْنِي مِنَ المُتَطَهِّرِينَ وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ."
    ],
    "دعاء النجاة من الفتن والابتلاءات": [
        "اللَّهُمَّ إِنَّا نَعُوذُ بِكَ مِنْ فِتَنِ الدُّنْيَا وَمَصَائِبِ الدَّهْرِ.",
        "اللَّهُمَّ اسْتُرْنَا فَوْقَ الأَرْضِ وَتَحْتَ الأَرْضِ وَيَوْمَ العَرْضِ عَلَيْكَ.",
        "اللَّهُمَّ لاَ تُحَمِّلْنَا مَا لاَ طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا.",
        "رَبَّنَا لاَ تَجْعَلْنَا فِتْنَةً لِلَّذِينَ كَفَرُوا وَاغْفِرْ لَنَا رَبَّنَا إِنَّكَ أَنْتَ العَزِيزُ الحَكِيمُ."
    ],
    "دعاء سلامة الصدر ومحبة الخير للناس": [
        "اللَّهُمَّ طَهِّرْ قُلُوبَنَا مِنَ الحَسَدِ وَالبَغْضَاءِ وَالأَحْقَادِ.",
        "اللَّهُمَّ اجْعَلْنَا مِمَّنْ يُحِبُّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ.",
        "اللَّهُمَّ انْزِعْ الغِلَّ مِنْ صُدُورِنَا وَاهْدِنَا سُبُلَ السَّلاَمِ.",
        "اللَّهُمَّ اجْعَلْنَا مَفَاتِيحَ لِلْخَيْرِ مَغَالِيقَ لِلشَّرِّ."
    ],    "دعاء طلب الرحمة والمغفرة لجميع المسلمين": [
        "اللَّهُمَّ اغْفِرْ لِلْمُسْلِمِينَ وَالْمُسْلِمَاتِ، وَالْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ، الأَحْيَاءِ مِنْهُمْ وَالأَمْوَاتِ.",

        // إنشاء الـ 200 مربع داخل شبكة الواجهة
        const grid = document.getElementById('grid');
        titles.forEach((title, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openModal(title);
            card.innerHTML = `
                <div class="card-number">مربع #${index + 1}</div>
                <div class="card-title">${title}</div>
            `;
            grid.appendChild(card);
        });

        // فتح النافذة المنبثقة
        function openModal(title) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');

            modalTitle.innerText = title;
            modalContent.innerHTML = '';

            // التثبت من وجود نصوص في القواعد أو إظهار النص التلقائي للعنوان
            const items = database[title] || [
                `آيات وأدعية موثوقة خاصة بـ (${title}).`,
                `عَنْ رَسُولِ اللَّهِ ﷺ قَالَ: «الدُّعَاءُ هُوَ العِبَادَةُ».`,
                `من أدعية النبي ﷺ: «اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى».`,
                `قال تعالى: ﴿وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾.`
            ];

            items.forEach((item, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item-card';
                itemDiv.innerHTML = `<b>${idx + 1}.</b> ${item}`;
                modalContent.appendChild(itemDiv);
            });

            modal.style.display = 'flex';
        }

        // إغلاق النافذة
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    }
