<title>ZAK Store</title>    
<style>    
*{    
margin:0;    
padding:0;    
box-sizing:border-box;    
font-family:Arial,sans-serif;    
}    
body{
background:linear-gradient(135deg,#1a0000,#000);
color:white;
padding-bottom: 40px;
}

header{
padding:15px;
background:#111;
position:sticky;
top:0;
z-index:1000;
border-bottom:1px solid rgba(255,215,0,.3);
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:bold;
color:#ffd700;
}

.logo-box{
width:40px;
height:40px;
border-radius:10px;
background:linear-gradient(135deg,#ffd700,#ff0000);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.hero{
padding:40px 20px 20px 20px;
text-align:center;
}

.hero h1{
font-size:35px;
color:#ffd700;  margin-bottom:10px;
}

.tabs-container {
display:flex;
justify-content:center;
gap:15px;
padding:10px;
margin-bottom:10px;
}

.tab-btn {
padding:12px 24px;
font-size:16px;
font-weight:bold;
border:1px solid #ffd700;
border-radius:25px;
background:transparent;
color:white;
cursor:pointer;
transition:.3s;
}

.tab-btn.active {
background:linear-gradient(90deg,#ffd700,#ff0000);
border:none;
box-shadow:0 0 10px rgba(255,215,0,0.4);
color: white;
}

.search{
text-align:center;
padding:15px;
}

.search input{
width:80%;
padding:12px;
border:none;
border-radius:12px;
background:#111;
color:white;
font-size:16px;
outline:none;
border:1px solid rgba(255,215,0,.1);
}

.search input:focus{
border:1px solid #ffd700;
}

.games{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
border-radius:15px;
overflow:hidden;
transition:.3s;
border:1px solid rgba(255,215,0,.2);
display:flex;
flex-direction:column;
height: 100%;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 5px 15px rgba(255,215,0,.1);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
background:#222;
}

.card-content{
padding:15px;
display:flex;
flex-direction:column;
flex-grow:1;
}

.card-content h3{
font-size:18px;
margin-bottom:5px;
color:#fff;
}

.card-content p{
font-size:14px;
color:#aaa;
margin-bottom:10px;
text-transform:capitalize;
}

.download-btn{
display:block;
text-align:center;
margin-top:auto;
padding:10px 15px;
border-radius:10px;
background:linear-gradient(90deg,#ffd700,#ff0000);
color:white;
text-decoration:none;
font-weight:bold;
transition:.2s;
}

.download-btn:hover{
opacity:0.9;
}
</style>

let currentGames = playStoreGames;

// دالة عرض الألعاب في الصفحة
function renderGames(games){
    const container = document.getElementById("games");
    
    // إذا لم يجد نتائج للبحث
    if(games.length === 0){
        container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #ffd700; font-size: 18px;">عذراً، لم يتم العثور على ألعاب مطابقة!</p>`;
        return;
    }

    container.innerHTML = games.map(game => `
        <div class="card">
            <img src="${game.img}" alt="${game.n}">
            <div class="card-content">
                <h3>${game.n}</h3>
                <p>${game.t}</p>
                <a href="${game.l}" target="_blank" class="download-btn">تحميل</a>
            </div>
        </div>
    `).join("");
}

// دالة التنقل بين ألعاب المتجر والتحميل المباشر
function switchTab(type){
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));

    if(type === "playstore"){
        currentGames = playStoreGames;
        document.getElementById("btn-playstore").classList.add("active");
    } else {
        currentGames = directGames;
        document.getElementById("btn-direct").classList.add("active");
    }

    renderGames(currentGames);
    document.getElementById("searchInput").value = ""; // تصفير خانة البحث عند التنقل
}

// نظام البحث الذكي عن الألعاب
document.getElementById("searchInput").addEventListener("input", function(){
    const search = this.value.toLowerCase();
    const filtered = currentGames.filter(game =>
        game.n.toLowerCase().includes(search) ||
        game.t.toLowerCase().includes(search)
    );
    renderGames(filtered);
});

// إظهار ألعاب متجر بلاي فوراً أول ما يفتح الموقع
renderGames(playStoreGames);
